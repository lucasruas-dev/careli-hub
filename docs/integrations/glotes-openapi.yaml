openapi: 3.1.0

# =====================================================================================
# API DA CARTEIRA LAVRA DO OURO, PARA O GLOTES
#
# Este arquivo é o CONTRATO que vai para o cliente. Ele nasce do levantamento campo a campo
# em docs/integrations/glotes-lavra-do-ouro.md, que foi feito contra a base real em 07/08/2026.
#
# TRÊS PRINCÍPIOS QUE EXPLICAM AS ESCOLHAS ABAIXO:
#
# 1. TODO CAMPO PEDIDO APARECE AQUI, inclusive os que a Careli não tem. Os que não temos vêm
#    documentados como sempre nulos, com o motivo. Omitir seria empurrar a descoberta para a
#    integração já em andamento, que é o pior momento para descobrir.
#
# 2. DINHEIRO É STRING DECIMAL, nunca número. `1234.56` em JSON vira ponto flutuante binário e
#    68 mil parcelas somadas por float divergem do fechamento. String decimal atravessa sem perda.
#
# 3. DOCUMENTO E CEP SAEM SÓ COM DÍGITOS. Na origem eles vêm com máscara (`000.000.000-00`,
#    `00.000-000`), e máscara é decisão de exibição, não de dado.
# =====================================================================================

info:
  title: Careli · Carteira Lavra do Ouro
  # 2.0.0 em 25/09/2026: o formato de `clientes.atualizado_em` mudou (agora leva o fuso), e quem
  # acrescentava o fuso ao valor antigo passa a receber 400. Mudança de formato em campo existente
  # é quebra de contrato, por isso a versão maior. Ver `x-historico`.
  version: "2.0.0"
  summary: Leitura da carteira administrada pela Careli, para consumo pelo GLOTES.
  description: |
    API de LEITURA da carteira do loteamento Lavra do Ouro, administrada pela Careli.

    ## O recorte

    O recorte é **fixo no token** e não é parametrizável: esta API só enxerga o Lavra do Ouro.
    Não existe parâmetro para pedir outro loteamento.

    **Um loteamento só, com 493 unidades.** Cada unidade é identificada por `codigo_lote`, e o par
    quadra e lote também identifica sem ambiguidade: foram conferidos 493 pares distintos para 493
    unidades, com **zero colisão**.

    As quadras em uso vão de 01 a 27, mas **com intervalos**: não existem as quadras 07 a 13, nem
    22 e 23. Não deduza a quadra por sequência.

    Volumes conferidos na base em 07/08/2026, para dimensionar a carga inicial:

    | Conjunto | Linhas |
    |---|---|
    | loteamentos | 1 |
    | clientes | 375 |
    | lotes | 493 |
    | vendas | 475 (abertas) |
    | recebimentos | 66.805 (só as parcelas mensais) |

    ## Como consumir

    1. **Primeira carga:** percorrer os cinco conjuntos até `proxima_pagina` vir nulo.
    2. **Incremental:** repetir `clientes`, `vendas` e `recebimentos` com `alterado_desde`, que
       devolve só o que mudou. Os três trazem `atualizado_em` em cada linha, já com o fuso
       (`2026-09-25T12:20:00-03:00`). Guarde o **maior** `atualizado_em` recebido em cada conjunto
       e, na chamada seguinte, repasse-o em `alterado_desde` **com margem de alguns minutos**
       (sugestão: 5 minutos antes). A comparação é `>=` e a margem faz linhas voltarem repetidas:
       trate toda linha como **upsert pela chave** (`codigo_cliente`, `codigo_venda`,
       `codigo_recebimento`). `loteamentos` e `lotes` mudam pouco e podem ser recarregados por
       inteiro.
    3. **Exclusões NÃO aparecem no incremental.** Parcela apagada na origem (por exemplo, um
       cronograma refeito) simplesmente deixa de existir, e `alterado_desde` só devolve o que
       ainda existe. **A listagem completa é a verdade.** Faça uma carga completa periódica
       (sugestão: semanal) e remova do seu lado o `codigo_recebimento` e o `codigo_venda` que
       deixaram de vir.

       ⚠️ **A carga completa de referência é feita com `incluir_canceladas=true` em `clientes`,
       `vendas` e `recebimentos`**, e só depois dela se remove o que não veio. Sem o parâmetro, a
       venda cancelada e TODAS as parcelas dela, inclusive as pagas, ficam fora da listagem, e a
       remoção apagaria do seu lado um contrato e um histórico de pagamento que existem. Em
       25/09/2026 são 100 vendas canceladas no recorte, e 7 delas guardam 116 parcelas mensais
       pagas.
    4. **Cancelamentos só aparecem na carga completa.** O cancelamento não move nenhum relógio na
       origem, porque o C2X não carimba o cancelamento: cancelar não faz a venda voltar em
       `alterado_desde`, com ou sem `incluir_canceladas`. Na carga completa de referência (item 3) a
       venda passa a vir com `situacao: "Cancelado"`; na listagem padrão, sem o parâmetro, ela
       some. As parcelas não pagas do contrato cancelado são apagadas na origem depois, numa
       limpeza sem data certa. Guarde a venda como cancelada, mantenha as parcelas pagas e trate
       como extinta toda parcela em aberto de contrato com `situacao: "Cancelado"`.

    ## Estado deste documento

    **API IMPLEMENTADA em 14/08/2026.** Os cinco endpoints existem, autenticam pelo header
    `X-Glotes-Token` e devolvem os volumes conferidos no levantamento (375 clientes, 493 lotes,
    475 vendas, 66.805 parcelas mensais). O token é entregue pela Careli por canal seguro.

    **Carga incremental CORRIGIDA em 25/09/2026** (ver `x-historico` no fim do arquivo). Até
    essa data o incremental de `vendas` e `recebimentos` deixava de entregar alterações: o corte
    estava deslocado em 3 horas e o relógio de cada linha era estreito demais. **Depois da
    correção, faça UMA carga completa** dos cinco conjuntos para reconciliar, com
    `incluir_canceladas=true` onde ele existe (item 3 acima): ela traz o que o incremental perdeu
    e deixa de trazer as parcelas apagadas na origem.

    O que continua em aberto está em `x-pendencias`, e nada disso impede começar a integração: os
    campos sem origem já vêm nulos e documentados.
  contact:
    name: Careli
    url: https://c2x.app.br

servers:
  - url: https://c2x.app.br/api/integrations/glotes
    description: Produção

security:
  - TokenGlotes: []

tags:
  - name: Cadastros
    description: |
      Mudam pouco. Recarregar por inteiro quando quiser. `clientes` também aceita carga
      incremental por `alterado_desde`.
  - name: Movimento
    description: Mudam todo dia. Aceitam carga incremental por `alterado_desde`.

paths:
  /loteamentos:
    get:
      tags: [Cadastros]
      summary: O loteamento do recorte
      description: |
        Devolve uma linha: o Lavra do Ouro.

        O endpoint existe mesmo com um único registro porque o GLOTES pede o conjunto, e porque
        amanhã a Careli pode administrar outro loteamento para a mesma loteadora sem que o
        contrato mude.
      operationId: listarLoteamentos
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de loteamentos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Loteamento" }
              example:
                dados:
                  - codigo_loteamento: LAVRA
                    nome: LAVRA DO OURO
                total: 1
                proxima_pagina: null
        "400": { $ref: "#/components/responses/PedidoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "429": { $ref: "#/components/responses/ExcedeuTeto" }

  /clientes:
    get:
      tags: [Cadastros]
      summary: Os compradores da carteira
      description: |
        375 clientes, sendo 369 pessoas físicas e 6 jurídicas.

        **Pessoa jurídica:** `nome` traz o representante pessoa física, como está na origem. A
        razão social vai em `razao_social` e o nome fantasia em `nome_fantasia`, ambos nulos para
        pessoa física.

        **Cônjuge:** 183 dos 375 clientes têm cônjuge cadastrado. Não é falha de cadastro: o
        universo aplicável (casados e união estável) é 181, e todos os 181 têm cônjuge. Cobertura
        de quem precisa: 100%.
      operationId: listarClientes
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AlteradoDesde"
        - name: incluir_canceladas
          in: query
          description: |
            Por padrão só os titulares de venda ativa (374 em 25/09/2026). Ligando, entram também
            os titulares de vendas canceladas: 434 com o parâmetro.

            **Use na carga completa de referência** (ver "Como consumir", item 3), junto com
            `vendas` e `recebimentos`: é o que garante que todo `codigo_cliente` das vendas
            canceladas exista do seu lado.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página de clientes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Cliente" }
              example:
                dados:
                  - codigo_cliente: CLI9001
                    nome: MARIA APARECIDA DE SOUZA
                    cpf_cnpj: "52998224725"
                    tipo_pessoa: F
                    razao_social: null
                    nome_fantasia: null
                    endereco: RUA DAS ACACIAS, 120, APTO 302
                    bairro: CENTRO
                    cidade: Mateus Leme
                    uf: MG
                    cep: "35670000"
                    conjuge_nome: JOAO CARLOS DE SOUZA
                    conjuge_cpf: "11122233396"
                    email: maria.souza@exemplo.com.br
                    telefone: "31999990000"
                    atualizado_em: "2026-09-18T10:59:44-03:00"
                total: 375
                proxima_pagina: "Y2xpOjE0Ng"
        "400": { $ref: "#/components/responses/PedidoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "429": { $ref: "#/components/responses/ExcedeuTeto" }

  /lotes:
    get:
      tags: [Cadastros]
      summary: As unidades do loteamento
      description: |
        493 unidades, todas do mesmo loteamento, distribuídas nas quadras 01 a 27.

        ⚠️ **As medidas dos lados não serão entregues.** `frente`, `fundo`, `lado_direito`,
        `lado_esquerdo`, `lado5` e `lado6` não existem na base da Careli, que guarda apenas a área
        total. Elas vivem no memorial descritivo e na matrícula, que são documentos, não dados.
        Os campos aparecem na resposta sempre nulos, para o contrato não quebrar. Se forem
        necessários, é preciso decidir de onde extrair (ver pendência P1).

        **Sobre `status`:** vem do cadastro comercial da unidade. Repare que o bloqueio de venda
        NÃO aparece nele: são marcações separadas, entregues em `bloqueado_para_venda` e
        `lote_caucionado`.
      operationId: listarLotes
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Página de lotes.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Lote" }
              example:
                dados:
                  - codigo_lote: LOU0101
                    codigo_loteamento: LAVRA
                    quadra: "01"
                    lote: "01"
                    status: Vendido
                    valor: "148500.00"
                    area_total: "444.32"
                    bloqueado_para_venda: false
                    lote_caucionado: false
                    frente: null
                    fundo: null
                    lado_direito: null
                    lado_esquerdo: null
                    lado5: null
                    lado6: null
                total: 493
                proxima_pagina: "bG90OkxPVTAxMDE"
        "400": { $ref: "#/components/responses/PedidoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "429": { $ref: "#/components/responses/ExcedeuTeto" }

  /vendas:
    get:
      tags: [Movimento]
      summary: Os contratos de venda
      description: |
        475 vendas abertas. Vendas canceladas não entram por padrão (ver `incluir_canceladas`).

        **Leia as três ressalvas antes de conciliar valores:**

        - `valor_venda` é o **preço de tabela da unidade**. A base da Careli não guarda um valor
          de venda separado, e a conferência contra os contratos assinados mostrou que o preço de
          tabela é a base do contrato. Se o GLOTES espera um valor negociado diferente do de
          tabela, ele não existe do nosso lado.
        - `valor_parcela` é **nulo na maioria dos casos**, de propósito. Em 467 das 474 vendas com
          parcelas o valor varia dentro do próprio contrato: parcelas já corrigidas convivem com
          parcelas futuras ainda no valor do contrato. Um número único ali seria mentira. O valor
          de cada parcela está em `/recebimentos` (leia a ressalva de `valor_parcela` lá).
        - `qtd_parcelas` e `qtd_sinal` são **contados** a partir das parcelas reais, não lidos de
          um campo declarado. Os dois divergem na origem em alguns contratos, e a contagem é a
          que corresponde ao que o cliente efetivamente deve.
      operationId: listarVendas
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AlteradoDesde"
        - name: incluir_canceladas
          in: query
          description: |
            Por padrão só vendas ativas. Ligando, entram também as canceladas, com
            `situacao: "Cancelado"`. São 100 no recorte em 25/09/2026 (574 vendas com o parâmetro,
            contra 474 sem ele).

            **Use na carga completa de referência** (ver "Como consumir", itens 3 e 4). Sem o
            parâmetro a venda cancelada some da listagem, e remover do seu lado o que não veio
            apagaria o contrato e as parcelas pagas dele.

            ⚠️ **Não serve para receber cancelamentos pelo incremental.** O parâmetro é aceito junto
            com `alterado_desde`, mas o cancelamento não move nenhum relógio na origem (o C2X não
            carimba o cancelamento): a venda cancelada depois da marca NÃO volta. Ela só aparece
            na carga completa.

            As parcelas pagas do contrato cancelado continuam em `/recebimentos` com
            `incluir_canceladas=true`. As não pagas são apagadas na origem depois, numa limpeza sem
            data certa; enquanto não forem, trate como extinta toda parcela em aberto de contrato
            com `situacao: "Cancelado"`.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página de vendas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Venda" }
              example:
                dados:
                  - codigo_venda: VEN-45
                    codigo_cliente: CLI9001
                    codigo_lote: LOU0101
                    data_venda: "2024-03-12"
                    valor_venda: "148500.00"
                    qtd_parcelas: 144
                    valor_parcela: null
                    data_1o_vencimento: "2024-05-10"
                    qtd_sinal: 6
                    valor_sinal: "12000.00"
                    data_sinal: "2024-04-10"
                    indice: IPCA ANUAL
                    situacao: Faturado
                    percentual_reajuste: null
                    observacao: null
                    atualizado_em: "2026-09-18T03:15:55-03:00"
                total: 475
                proxima_pagina: "dmVuOjQ1"
        "400": { $ref: "#/components/responses/PedidoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "429": { $ref: "#/components/responses/ExcedeuTeto" }

  /recebimentos:
    get:
      tags: [Movimento]
      summary: As parcelas mensais, pagas e a vencer
      description: |
        **Só o PARCELAMENTO.** Ato e Sinal não entram aqui (decisão da Careli, 14/08/2026): eles
        são a ENTRADA do contrato, e a entrada já vem descrita no conjunto `vendas`, nos campos
        `qtd_sinal`, `valor_sinal` e `data_sinal`. Trazê-los também como recebimento faria a
        entrada ser contada duas vezes.

        **66.805 parcelas mensais.** É o conjunto grande: use `alterado_desde` depois da primeira
        carga.

        **A chave única de uma parcela é `codigo_recebimento`.** O `numero_parcela` **se repete**
        dentro do mesmo contrato e não serve como chave: use-o só para exibir.

        **Encargos e correção:** `valor_juros` vem preenchido em menos de 1% das linhas (624 de
        66.501 em 25/09/2026),
        `valor_multa` é sempre nulo (a Careli não grava multa nessa base) e `valor_desconto` não
        existe. Quando um pagamento inclui correção monetária, juros ou multa, a diferença está
        embutida em `valor_pago` sem decomposição. Conferido em 25/09/2026: das 11.977 parcelas
        pagas, 5.389 (45%) foram pagas acima de `valor_parcela`, somando R$ 151.872,85 de
        diferença, e só R$ 8.452,53 dela (5,6%) aparece em `valor_juros`. Somar `valor_juros`
        para chegar ao total de encargos vai dar errado.
      operationId: listarRecebimentos
      parameters:
        - $ref: "#/components/parameters/Limite"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AlteradoDesde"
        - name: incluir_canceladas
          in: query
          description: |
            Por padrão só as parcelas de vendas ativas. Ligando, entram também as parcelas dos
            contratos cancelados (a venda vem com `situacao: "Cancelado"` em `/vendas` com o mesmo
            parâmetro).

            ⚠️ **Sem este parâmetro, nenhuma parcela de contrato cancelado volta, nem as pagas.**
            Em 25/09/2026 são 116 parcelas mensais pagas em 7 vendas canceladas: o total vai de
            66.501 para 66.617 com o parâmetro. Use-o na carga completa de referência (ver "Como
            consumir", item 3); sem ele, remover do seu lado o que não veio apaga histórico de
            pagamento que existe.

            Parcela em aberto de contrato com `situacao: "Cancelado"` é tratada como extinta: as
            não pagas são apagadas na origem depois, numa limpeza sem data certa (ver "Como
            consumir", item 4).
          schema: { type: boolean, default: false }
        - name: codigo_venda
          in: query
          description: Todas as parcelas de um contrato.
          schema: { type: string }
        - name: status_parcela
          in: query
          schema:
            type: string
            enum: [Pago, Aguardando pagamento, Atrasado]
        - name: vencimento_de
          in: query
          schema: { type: string, format: date }
        - name: vencimento_ate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Página de recebimentos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      dados:
                        type: array
                        items: { $ref: "#/components/schemas/Recebimento" }
              example:
                dados:
                  - codigo_recebimento: REC-882311
                    codigo_venda: VEN-45
                    codigo_cliente: CLI9001
                    numero_parcela: 12
                    tipo_parcela: Parcela
                    data_vencimento: "2025-04-10"
                    valor_parcela: "1187.34"
                    valor_original: "1187.34"
                    data_pagamento: "2025-04-09"
                    valor_pago: "1187.34"
                    valor_juros: null
                    valor_multa: null
                    valor_desconto: null
                    forma_pagamento: Boleto
                    status_parcela: Pago
                    nosso_numero: null
                    observacao: null
                    atualizado_em: "2025-04-09T10:12:45-03:00"
                total: 66501
                proxima_pagina: "cmVjOjg4MjMxMQ"
        "400": { $ref: "#/components/responses/PedidoInvalido" }
        "401": { $ref: "#/components/responses/NaoAutorizado" }
        "429": { $ref: "#/components/responses/ExcedeuTeto" }

components:
  securitySchemes:
    TokenGlotes:
      type: apiKey
      in: header
      name: X-Glotes-Token
      description: |
        Token de máquina, exclusivo do GLOTES, entregue pela Careli por canal seguro.

        **Sempre no header, nunca na query string.** Token em URL aparece em log de proxy, em
        histórico de navegador e em referer, e aqui ele dá acesso a dado pessoal de 375 titulares.

        O token carrega o escopo: ele só enxerga o Lavra do Ouro, e isso não é parametrizável.
        Em caso de suspeita de vazamento, a Careli revoga na hora e emite outro.

  parameters:
    Limite:
      name: limite
      in: query
      description: Linhas por página. Máximo 1000.
      schema: { type: integer, default: 500, minimum: 1, maximum: 1000 }
    Cursor:
      name: cursor
      in: query
      description: |
        Repasse aqui o `proxima_pagina` da resposta anterior. O conteúdo é opaco: não interprete
        nem construa cursor à mão, o formato pode mudar sem aviso.
      schema: { type: string }
    AlteradoDesde:
      name: alterado_desde
      in: query
      description: |
        Só o que mudou a partir deste instante. ISO 8601 **com fuso** (sem fuso a chamada é
        recusada com 400). Sem o parâmetro, carga completa. Aceito em `clientes`, `vendas` e
        `recebimentos`; nos outros dois conjuntos é ignorado.

        **O corte é feito contra o `atualizado_em` de cada linha**, e o `atualizado_em` já sai no
        formato que este parâmetro aceita: repasse o valor como veio, sem acrescentar fuso. Cada
        conjunto tem o seu relógio, que é o mais recente entre as fontes da linha:

        | Conjunto | `atualizado_em` é a alteração mais recente entre |
        |---|---|
        | `clientes` | o cadastro do cliente, os telefones, o endereço e o cônjuge na Careli, os contatos (e-mail, telefone) atualizados pelo atendimento e o contrato do Lavra de que ele é titular (uma venda nova ou uma troca de titular traz o cliente de volta) |
        | `vendas` | o contrato, as parcelas de sinal e de mensalidade dele (inclusive as marcadas para exclusão) e a unidade |
        | `recebimentos` | a parcela e o contrato dela (a troca de titular muda `codigo_cliente` de todas as parcelas do contrato) |

        **A comparação é `>=`:** a linha que tem exatamente a marca volta de novo. Isso é
        intencional e seguro, porque a chave de cada conjunto é estável: trate cada linha como
        upsert pela chave.

        **Repasse o maior `atualizado_em` com margem de alguns minutos** (sugestão: 5 minutos
        antes). A origem carimba o instante da gravação, não o da conclusão: uma alteração em
        lote (por exemplo, um cronograma de 144 parcelas refeito) que ainda estava em andamento
        quando você leu pode aparecer depois com carimbo anterior ao maior valor que você viu. A
        margem cobre isso ao custo de algumas linhas repetidas.

        **Cada lote de emissão de boletos devolve quase tudo no incremental seguinte.** A emissão
        de boletos em lote no Asaas toca as parcelas na origem (grava nelas a referência do
        boleto), e isso move o relógio das parcelas tocadas e o de quase todas as vendas, mesmo
        sem mudança em nenhum campo entregue por esta API. É esperado e seguro: trate como
        upsert. Exemplo medido: em 10/09/2026, entre 01h e 02h, 566 parcelas de 242 vendas
        abertas foram tocadas assim, e nenhuma foi criada.

        ⚠️ **O que é APAGADO e o que é CANCELADO não voltam no incremental**: ver "Como
        consumir", itens 3 e 4. A carga completa periódica é a garantia de que as duas bases
        batem.
      schema: { type: string, format: date-time }
      example: "2026-09-25T12:15:00-03:00"

  responses:
    PedidoInvalido:
      description: |
        Parâmetro malformado: data sem fuso em `alterado_desde`, `limite` fora da faixa, ou cursor
        ilegível. A mensagem diz qual parâmetro recusou. Não repita a chamada sem corrigir.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            erro: parametro_invalido
            mensagem: "O parâmetro alterado_desde precisa incluir o fuso horário."
    NaoAutorizado:
      description: Token ausente, inválido ou revogado.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: { erro: nao_autorizado, mensagem: Token inválido ou revogado. }
    ExcedeuTeto:
      description: |
        Teto de requisições excedido. O header `Retry-After` diz quantos segundos esperar.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example: { erro: teto_excedido, mensagem: Aguarde antes de tentar de novo. }

  schemas:
    Pagina:
      type: object
      required: [dados, total, proxima_pagina]
      properties:
        dados:
          type: array
          items: { type: object }
        total:
          type: integer
          description: |
            Total de linhas do conjunto inteiro, não da página. Com `alterado_desde`, em `vendas`
            e `recebimentos` é o total do que passou no corte. Em `clientes` o corte é feito
            página a página, depois de juntar os contatos do atendimento, e `total` conta só a
            página: com `alterado_desde` em `clientes`, use `limite=1000` (a base inteira cabe
            numa página).
        proxima_pagina:
          type: [string, "null"]
          description: Cursor da próxima página. `null` quando acabou.

    Erro:
      type: object
      required: [erro, mensagem]
      properties:
        erro: { type: string }
        mensagem: { type: string }

    Dinheiro:
      type: [string, "null"]
      description: |
        Decimal com duas casas, como texto (`"1187.34"`). Ponto como separador decimal, sem
        separador de milhar e sem símbolo de moeda. É texto para não perder precisão: somar 68 mil
        parcelas em ponto flutuante diverge do fechamento em centavos.
      pattern: '^-?\d+\.\d{2}$'
      examples: ["148500.00", "1187.34"]

    Loteamento:
      type: object
      required: [codigo_loteamento, nome]
      properties:
        codigo_loteamento:
          type: string
          description: Código curto e estável. É a chave usada nos outros conjuntos.
          examples: [LAVRA]
        nome:
          type: string
          description: Nome do loteamento.
          examples: [LAVRA DO OURO]

    Cliente:
      type: object
      required: [codigo_cliente, nome, cpf_cnpj, tipo_pessoa]
      properties:
        codigo_cliente:
          type: string
          description: Chave do cliente. Único em toda a base, sem duplicata.
          examples: [CLI9001]
        nome:
          type: string
          description: |
            Pessoa física: o nome do cliente. Pessoa jurídica: o nome do representante, como está
            na origem. A razão social vai em `razao_social`.
        cpf_cnpj:
          type: string
          description: Só dígitos, sem máscara. 11 para CPF, 14 para CNPJ.
          pattern: '^\d{11}$|^\d{14}$'
        tipo_pessoa:
          type: string
          enum: [F, J]
        razao_social: { type: [string, "null"], description: Só para pessoa jurídica. }
        nome_fantasia: { type: [string, "null"], description: Só para pessoa jurídica. }
        endereco:
          type: [string, "null"]
          description: Logradouro, número e complemento juntos. Complemento presente em 33% dos casos.
        bairro: { type: [string, "null"] }
        cidade: { type: [string, "null"], description: Com acentuação. }
        uf: { type: [string, "null"], pattern: '^[A-Z]{2}$' }
        cep: { type: [string, "null"], description: Oito dígitos, sem máscara., pattern: '^\d{8}$' }
        conjuge_nome:
          type: [string, "null"]
          description: Nulo para quem não tem cônjuge cadastrado (192 dos 375).
        conjuge_cpf: { type: [string, "null"], pattern: '^\d{11}$' }
        email:
          type: [string, "null"]
          description: E-mail atual do cadastro. Nulo quando a Careli não tem o dado.
        telefone:
          type: [string, "null"]
          description: |
            Telefone atual do cadastro, só dígitos (DDD incluído; pode vir com o 55 do país).
            Quando o cliente tem mais de um, sai o preferido — WhatsApp primeiro, depois o mais
            recente. Nulo quando a Careli não tem o dado.
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: |
            Última alteração do cliente: dados do cadastro, telefones, endereço, cônjuge,
            contatos atualizados pelo atendimento e o contrato do Lavra de que ele é titular (uma
            venda nova ou uma troca de titular traz o cliente de volta), o que for mais recente.
            ISO 8601 com o fuso de Brasília daquele instante (`-03:00` hoje; `-02:00` em datas do
            antigo horário de verão). É o relógio do filtro `alterado_desde`, e o valor é aceito
            nele como veio.

            ⚠️ **Formato mudou em 25/09/2026.** Antes saía `YYYY-MM-DD HH:MM:SS`, sem fuso, e
            repassar esse valor em `alterado_desde` dava 400. Se a sua integração acrescentava
            `-03:00` ao valor recebido, **pare de acrescentar**: no formato novo isso produz uma
            data inválida e a chamada volta 400. Endereço, cônjuge e o contrato de que o cliente é
            titular passaram a mover o relógio na mesma data.
          examples: ["2026-09-18T10:59:44-03:00"]

    Lote:
      type: object
      required: [codigo_lote, codigo_loteamento, quadra, lote, status, valor]
      properties:
        codigo_lote:
          type: string
          description: |
            Código da unidade como está no cadastro. Único em todas as 493 unidades.

            ⚠️ O prefixo do código (`LOU`, `LOS`) é **histórico** e NÃO corresponde ao campo
            `codigo_loteamento`, que é sempre `LAVRA`. Trate este código como texto opaco: não
            extraia o prefixo para casar com o loteamento, porque não casa em nenhuma linha.
          examples: [LOU0101]
        codigo_loteamento: { type: string, examples: [LAVRA] }
        quadra:
          type: string
          description: Texto com zero à esquerda, como no cadastro.
          examples: ["01"]
        lote: { type: string, examples: ["01"] }
        status:
          type: string
          enum: [Disponível, Reservado, Em negociação, Vendido, Bloqueado para venda]
          description: |
            No recorte atual só ocorrem `Vendido` (475) e `Disponível` (18). Os outros três valores
            existem no cadastro e estão listados para o GLOTES não quebrar se aparecerem.
        valor:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: Preço de tabela da unidade. Preenchido em todas as 493.
        area_total:
          type: [string, "null"]
          description: |
            Área em metros quadrados, decimal como texto. Preenchida em todas as 493.
            **Não é dinheiro:** não segue o padrão de duas casas.
          pattern: '^\d+\.\d{1,4}$'
          examples: ["444.32"]
        bloqueado_para_venda:
          type: boolean
          description: |
            Marcação separada do `status`. São 7 unidades. Um lote pode estar `Disponível` e
            bloqueado ao mesmo tempo.
        lote_caucionado:
          type: boolean
          description: Unidade dada em garantia. São 51 unidades.
        frente:
          type: "null"
          description: |
            ⚠️ SEMPRE NULO. A Careli guarda apenas a área total da unidade; as medidas dos lados
            estão no memorial descritivo e na matrícula, que são documentos e não campos. Ver
            pendência P1.
        fundo: { type: "null", description: "⚠️ SEMPRE NULO. Ver `frente`." }
        lado_direito: { type: "null", description: "⚠️ SEMPRE NULO. Ver `frente`." }
        lado_esquerdo: { type: "null", description: "⚠️ SEMPRE NULO. Ver `frente`." }
        lado5: { type: "null", description: "⚠️ SEMPRE NULO. Ver `frente`." }
        lado6: { type: "null", description: "⚠️ SEMPRE NULO. Ver `frente`." }

    Venda:
      type: object
      required:
        [codigo_venda, codigo_cliente, codigo_lote, data_venda, valor_venda,
         qtd_parcelas, data_1o_vencimento, qtd_sinal, valor_sinal, data_sinal]
      properties:
        codigo_venda:
          type: string
          description: |
            Chave do contrato, prefixada para não colidir com códigos de outros conjuntos.
          examples: [VEN-45]
        codigo_cliente: { type: string, examples: [CLI9001] }
        codigo_lote: { type: string, examples: [LOU0101] }
        data_venda:
          type: string
          format: date
          description: Data do ato. Preenchida em todas as 475 vendas.
        valor_venda:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            Preço de tabela da unidade. Ver a ressalva na descrição do endpoint: não existe valor
            de venda separado do preço de tabela nesta base.
        qtd_parcelas:
          type: integer
          description: Contagem real das parcelas mensais do contrato.
        valor_parcela:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            **Nulo na maioria dos contratos**, porque o valor varia ao longo do cronograma. Use
            `/recebimentos` para o valor de cada parcela. Só vem preenchido quando todas as
            parcelas do contrato têm o mesmo valor (7 dos 474 contratos).
        data_1o_vencimento: { type: [string, "null"], format: date }
        qtd_sinal:
          type: integer
          description: Contagem real das parcelas de sinal.
        valor_sinal:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: Soma das parcelas de sinal.
        data_sinal: { type: [string, "null"], format: date }
        indice:
          type: [string, "null"]
          description: |
            Índice de correção do contrato. 465 das 475 vendas resolvem para `IPCA ANUAL`; 10
            contratos têm plano personalizado e ficam sem índice.
          examples: [IPCA ANUAL]
        situacao:
          type: [string, "null"]
          description: Estágio do contrato. Nas vendas ativas do recorte é sempre `Faturado`.
          examples: [Faturado, Cancelado]
        percentual_reajuste:
          type: "null"
          description: |
            ⚠️ SEMPRE NULO, por decisão da Careli (14/08/2026).

            O plano comercial tem **dois** percentuais distintos, e ambos são chamados de reajuste
            em contextos diferentes. Enviar um deles sem que os dois lados concordem sobre qual é
            qual levaria o GLOTES a recalcular a carteira em cima do número errado, e a
            divergência só apareceria no fechamento. A correção do contrato está em `indice`.
        observacao:
          type: "null"
          description: ⚠️ SEMPRE NULO. O campo existe na origem e está vazio em todas as 475 vendas.
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: |
            **Novo em 25/09/2026.** Última alteração da venda: o contrato, as parcelas de sinal e
            de mensalidade dele (inclusive as marcadas para exclusão) ou a unidade, o que for mais
            recente. As parcelas entram porque `qtd_parcelas`, `qtd_sinal`, `valor_sinal`,
            `valor_parcela` e `data_1o_vencimento` são calculados a partir delas; a unidade, porque
            `valor_venda` e `codigo_lote` vêm dela.

            ISO 8601 com o fuso de Brasília daquele instante. É o relógio do filtro
            `alterado_desde`, e o valor é aceito nele como veio.

            ⚠️ Parcela apagada na origem não move este relógio (a parcela deixa de existir). Se o
            cronograma for refeito, as parcelas novas movem; se só for apagado, não. Ver "Como
            consumir", item 3.
          examples: ["2026-09-18T03:15:55-03:00"]

    Recebimento:
      type: object
      required:
        [codigo_recebimento, codigo_venda, codigo_cliente, numero_parcela, tipo_parcela,
         data_vencimento, valor_parcela, status_parcela]
      properties:
        codigo_recebimento:
          type: string
          description: |
            **A chave única da parcela.** Use este campo para idempotência e para casar
            atualizações. Não use `numero_parcela`.
          examples: [REC-882311]
        codigo_venda: { type: string, examples: [VEN-45] }
        codigo_cliente: { type: string, examples: [CLI9001] }
        numero_parcela:
          type: integer
          description: |
            Número de exibição da parcela dentro do contrato. ⚠️ **Se repete**: há contratos com
            duas linhas de mesmo número. Serve para mostrar, nunca para identificar.
        tipo_parcela:
          type: string
          enum: [Parcela]
          description: |
            Sempre `Parcela`. O campo permanece no contrato por compatibilidade, mas este conjunto
            traz apenas o parcelamento: Ato e Sinal ficam fora, e a entrada é descrita em `vendas`.
        data_vencimento: { type: string, format: date }
        valor_parcela:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            Valor da parcela **no cronograma** da Careli.

            ⚠️ **Não é, necessariamente, o valor atualizado.** A correção anual do contrato é
            lançada na parcela quando o boleto dela é emitido; as parcelas futuras, ainda sem
            boleto, ficam com o valor do contrato e podem estar defasadas em relação ao que será
            cobrado. Por isso o `valor_pago` de uma parcela paga pode ser maior que este valor
            (ver `valor_pago`). Não use a soma das parcelas futuras como saldo corrigido.
        valor_original:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            Mesmo valor de `valor_parcela`: a origem não guarda um valor original separado do
            valor do cronograma. Entregue para o GLOTES não precisar tratar ausência.
        data_pagamento:
          type: [string, "null"]
          format: date
          description: |
            Nula enquanto não paga. Desde 25/09/2026, parcela sem data de pagamento vem com
            `valor_pago` nulo (a única exceção é parcela com `status_parcela` Pago, que mantém o
            valor mesmo sem data; em 25/09/2026 era 1 parcela).
        valor_pago:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            Nulo quando não houve pagamento. ⚠️ Zero não é pagamento: há linhas com valor pago
            igual a zero que significam ausência de pagamento, e elas vêm como nulo aqui.

            ⚠️ **Valor sem data de pagamento também não é pagamento** (corrigido em 25/09/2026).
            A origem grava no campo de valor pago o valor do boleto emitido, antes de o cliente
            pagar. Até 24/09 a API entregava esse valor, e este contrato o descrevia como
            "pagamento parcial": em 25/09/2026 eram 761 parcelas em atraso com `valor_pago` igual
            ao valor da parcela e sem `data_pagamento`, R$ 409.304,99, nenhuma parcial. Agora
            `valor_pago` só vem preenchido quando há `data_pagamento` ou quando `status_parcela` é
            Pago.

            ⚠️ **Pode ser maior que `valor_parcela`**, e a diferença não vem decomposta: pode ser
            correção monetária, juros ou multa. Conferido em 25/09/2026, nas 11.977 parcelas
            pagas: 5.389 (45%) foram pagas acima de `valor_parcela`, R$ 151.872,85 no total, e
            só R$ 8.452,53 disso (5,6%) aparece em `valor_juros`. 1.324 dessas parcelas foram
            pagas em dia, com diferença média de 6,5%: ali a diferença não vem de atraso.
        valor_juros:
          type: [string, "null"]
          pattern: '^-?\d+\.\d{2}$'
          description: |
            ⚠️ Preenchido em menos de 1% das linhas (624 de 66.501 em 25/09/2026, todas pagas).
            Explica só 5,6% do que foi pago acima de `valor_parcela`; o resto está embutido em
            `valor_pago` sem decomposição. Não serve para totalizar encargos.
        valor_multa:
          type: "null"
          description: ⚠️ SEMPRE NULO. A Careli não registra multa nesta base.
        valor_desconto:
          type: "null"
          description: ⚠️ SEMPRE NULO. Não existe registro de desconto na origem.
        forma_pagamento:
          type: [string, "null"]
          description: |
            Constante `Boleto` em todas as linhas hoje. O campo existe, mas não distingue meio de
            pagamento na prática.
        status_parcela:
          type: string
          enum: [Pago, Aguardando pagamento, Atrasado]
        nosso_numero:
          type: "null"
          description: ⚠️ SEMPRE NULO. Não há identificador bancário disponível nesta base.
        observacao:
          type: "null"
          description: ⚠️ SEMPRE NULO. Preenchido em 1 linha de toda a carteira.
        atualizado_em:
          type: [string, "null"]
          format: date-time
          description: |
            **Novo em 25/09/2026** (pedido do GLOTES em 10/09). Última alteração do recebimento:
            a parcela (baixa, mudança de status, de valor ou de vencimento) ou o contrato dela, o
            que for mais recente. O contrato entra porque `codigo_cliente` vem do titular do
            contrato: numa troca de titular a parcela em si não muda, mas o `codigo_cliente` de
            todas as parcelas do contrato muda.

            ISO 8601 com o fuso de Brasília daquele instante. É o relógio do filtro
            `alterado_desde`, e o valor é aceito nele como veio.
          examples: ["2025-04-09T10:12:45-03:00"]

# =====================================================================================
# PENDÊNCIAS: o que precisa de decisão antes de esta API existir.
# Ficam no arquivo de propósito, para o cliente ver o que está em aberto e responder.
# =====================================================================================
x-pendencias:
  P1:
    assunto: Medidas do lote (frente, fundo, lados)
    situacao: |
      FECHADA em 14/08/2026. Não existem na base da Careli, e a decisão foi entregar apenas o
      tamanho do lote como um todo: `area_total`, que está preenchida nas 493 unidades.
    decisao: |
      `frente`, `fundo`, `lado_direito`, `lado_esquerdo`, `lado5` e `lado6` permanecem no contrato
      e vêm sempre nulos. Se um dia forem necessários, saem do memorial descritivo ou da
      matrícula, o que é um projeto à parte de extração documento a documento.
    de_quem: Careli (decidido)
  P2:
    assunto: Qual percentual é o reajuste
    situacao: |
      FECHADA em 14/08/2026. O plano comercial tem duas taxas distintas e ambas são chamadas de
      reajuste; a Careli decidiu não enviar nenhuma.
    decisao: |
      `percentual_reajuste` vem sempre nulo. A correção monetária do contrato continua sendo
      informada em `indice` (IPCA ANUAL em 465 das 475 vendas).
    de_quem: Careli (decidido)
  P3:
    assunto: Confiabilidade da carga incremental
    situacao: |
      RESOLVIDA em 14/08/2026, com teste contra a base. `payments.updated_at` acompanha a
      alteração: das 68.481 parcelas do recorte, 13.303 têm `updated_at` posterior ao
      `created_at`, o movimento diário aparece na coluna, e **zero** parcelas pagas nos últimos 30
      dias ficaram com `updated_at` anterior à data de pagamento — que seria a prova de que a
      coluna não acompanha.
    decisao: |
      `alterado_desde` está liberado para `vendas` e `recebimentos` (e, desde 24/08/2026, para
      `clientes`). `loteamentos` e `lotes` mudam pouco e devem ser recarregados por inteiro.
    reaberta_em_25_09_2026: |
      A coluna acompanhava, mas o incremental perdia linhas por dois motivos que o teste de
      14/08 não cobria: o corte comparava a marca em UTC com uma coluna gravada no horário de
      Brasília, e o relógio de `vendas` e de `recebimentos` não enxergava tudo o que muda a
      linha. Corrigido na mesma data (ver `x-historico`). O que continua fora do incremental, por
      natureza, é a EXCLUSÃO e o CANCELAMENTO (que não move relógio nenhum na origem): a carga
      completa periódica, com `incluir_canceladas=true`, é a garantia.
    de_quem: Careli
  P4:
    assunto: Base legal e minimização de dado pessoal
    situacao: |
      São 375 titulares, com nome, CPF, endereço completo e, em 183 casos, nome e CPF do cônjuge.
    decisao: |
      Antes de ligar: base legal definida pelo jurídico, acordo de tratamento entre as partes, e
      decisão sobre minimização. Campo recomendado não é campo necessário: se o GLOTES não usa o
      CPF do cônjuge, ele não deve ser enviado.
    de_quem: Careli (jurídico) e cliente

# =====================================================================================
# HISTÓRICO: o que mudou no contrato depois de a API entrar no ar, e o que o GLOTES precisa
# fazer a cada mudança. A entrada mais recente fica em cima.
# =====================================================================================
x-historico:
  - data: "2026-09-25"
    versao: "2.0.0"
    assunto: Carga incremental corrigida
    mudancas:
      - |
        `alterado_desde` passou a cortar no fuso certo em `vendas` e `recebimentos`. A marca era
        comparada em UTC com uma coluna gravada no horário de Brasília, e o corte andava 3 horas
        para a frente: o que mudava nessas 3 horas não vinha nunca. Exemplo medido: desde
        10/09/2026 00:00 (-03:00), o incremental de `recebimentos` devolvia 534 parcelas contra
        1.564 alteradas de fato.
      - |
        `recebimentos` ganhou `atualizado_em`, e o relógio passou a ser a parcela OU o contrato
        dela. Uma troca de titular (que muda `codigo_cliente` de todas as parcelas) agora
        reaparece no incremental. Exemplo medido: a troca de titular da VEN-223 em 15/09 mudou o
        titular de 144 parcelas e só 1 delas voltava no incremental.
      - |
        `vendas` ganhou `atualizado_em`, e o relógio passou a incluir as parcelas de sinal e de
        mensalidade e a unidade (antes era só o contrato). Exemplo medido: desde 10/09 o
        incremental devolvia 2 vendas; com o relógio novo, 459 das 474 (a emissão de boletos em
        lote no Asaas toca as parcelas: em 10/09, entre 01h e 02h, 566 parcelas de 242 vendas).
      - |
        `clientes.atualizado_em` passou a sair com fuso (quebra de formato: ver a descrição do
        campo) e a considerar também endereço, cônjuge e o contrato do Lavra de que o cliente é
        titular. Uma venda nova ou uma troca de titular agora traz o cliente de volta no
        incremental. Exemplo medido: um cliente com cadastro de 10/09 virou titular de uma venda
        criada em 16/09, e o incremental de `clientes` a partir de 16/09 não o devolvia, enquanto
        `vendas` e `recebimentos` chegavam com o `codigo_cliente` dele.
      - |
        `valor_pago` deixou de vir preenchido em parcela sem `data_pagamento` (exceto status
        Pago). A origem grava ali o valor do boleto emitido antes do pagamento, e a API entregava
        esse valor como se fosse recebido. Exemplo medido: 761 parcelas em atraso com
        `valor_pago` igual ao valor da parcela e sem data, R$ 409.304,99, nenhuma parcial. A
        versão anterior deste contrato chamava isso de "pagamento parcial", o que estava errado.
      - |
        Documentado o que o incremental não entrega (exclusões e cancelamentos), a margem
        recomendada ao repassar a marca, a borda `>=` (linhas repetidas, tratar como upsert), o
        volume que cada lote de boletos devolve, que o cancelamento só aparece na carga completa,
        que a carga completa de referência usa `incluir_canceladas=true` (agora documentado
        também em `clientes` e `recebimentos`) e o que `valor_parcela` significa de fato.
    acao_do_glotes:
      - |
        Fazer UMA carga completa dos cinco conjuntos depois desta versão, com
        `incluir_canceladas=true` em `clientes`, `vendas` e `recebimentos`, e só então remover do
        seu lado o `codigo_recebimento` e o `codigo_venda` que não vierem nela. Sem o parâmetro,
        a remoção apagaria as vendas canceladas e as parcelas pagas delas. Em 25/09/2026 a
        Careli identificou 160 parcelas que foram apagadas na origem e que o incremental não
        tinha como avisar: 144 da VEN-81 (cronograma refeito naquele dia) e 16 da VEN-524.
      - |
        A carga completa também corrige o `valor_pago` das parcelas que vinham com o valor do
        boleto (762 em 25/09/2026: 761 em atraso e 1 aguardando, R$ 411.581,32): elas passam a
        vir com `valor_pago` nulo. O incremental NÃO traz essa correção, porque o relógio dessas
        parcelas não muda; só a carga completa. Se o GLOTES somou esses valores como recebidos,
        refazer a soma depois da carga.
      - |
        Se a integração acrescentava `-03:00` ao `atualizado_em` de `clientes`, parar: o valor
        agora já vem com fuso e deve ser repassado como veio.
      - |
        Passar a guardar `atualizado_em` de `vendas` e `recebimentos` e repassar o maior valor,
        com margem de alguns minutos, em `alterado_desde`.
