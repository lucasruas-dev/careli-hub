<title>Vale do Ouro · Masterplan</title>
<style>
  :root {
    --vermelho:#e02020; --amarelo:#f2c200; --verde:#3fa845;
    --tinta:#121722; --fraco:#667085; --linha:#dce2ea; --fundo:#f7f8fa; --carta:#fff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--tinta);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  header { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:16px 22px; background:var(--carta); border-bottom:1px solid var(--linha); }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--fraco); font-size:12.5px; }
  .legenda { display:flex; gap:16px; margin-left:auto; flex-wrap:wrap; }
  .lg { display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--fraco); }
  .lg i { width:12px; height:12px; border-radius:3px; display:block; }
  .lg b { color:var(--tinta); font-variant-numeric:tabular-nums; }
  .palco { padding:18px 22px 40px; }
  .placa { position:relative; max-width:1600px; margin:0 auto;
    border:1px solid var(--linha); border-radius:12px; overflow:hidden; background:#000; }
  .placa img { display:block; width:100%; height:auto; }
  svg { position:absolute; inset:0; width:100%; height:100%; }
  .lote { stroke:rgba(255,255,255,.55); stroke-width:1.5; fill-opacity:.62;
    transition:fill-opacity .12s; cursor:default; }
  .lote:hover { fill-opacity:.9; stroke-width:2.5; }
  .vermelho { fill:var(--vermelho); }
  .amarelo  { fill:var(--amarelo); }
  .verde    { fill:var(--verde); }
  footer { text-align:center; color:var(--fraco); font-size:11.5px; padding:0 22px 30px; }
</style>

</header>
