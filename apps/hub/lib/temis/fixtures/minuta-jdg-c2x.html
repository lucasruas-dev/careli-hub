span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>([area_lote_extenso] metros quadrados)</strong></span><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">, integrante do empreendimento denominado “Vale do Ouro”, situado no Município de Pará de Minas/MG, com limites e confrontações constantes da Matrícula individual nº <strong>[numero_matricula]</strong>, Livro 2, do Cartório de Registro de Imóveis da Comarca de Pará de Minas/MG.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O empreendimento é implantado sobre a gleba originária objeto da Matrícula nº 76.566, aberta em 17 de dezembro de 2020, com área registral de 18,1830 ha, situada no lugar denominado “Fazenda dos Gomes”, no Município e Comarca de Pará de Minas/MG.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">A promessa de compra e venda é celebrada ad corpus, prevalecendo a descrição da matrícula individual, do registro do loteamento e do projeto aprovado, admitidas as variações legalmente toleradas que não alterem substancialmente a localização, a funcionalidade ou a destinação do lote.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>III - CARACTERIZAÇÃO URBANÍSTICA E DESTINAÇÃO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O Vale do Ouro é um bairro de uso misto, com setores e/ou lotes de destinação residencial, comercial ou mista, conforme o projeto aprovado, o decreto municipal, o registro imobiliário, o memorial descritivo e a legislação de uso e ocupação do solo.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>IV - MATRÍCULA ORIGINÁRIA, APROVAÇÃO, REGISTRO E ÔNUS</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Matrícula originária da gleba:&nbsp;</strong>nº 76.566, Livro 2, do Cartório de Registro de Imóveis da Comarca de Pará de Minas/MG.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Área e localização da gleba originária:&nbsp;</strong>18,1830 ha, situada no lugar denominado “Fazenda dos Gomes”, Município e Comarca de Pará de Minas/MG.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Inserção no perímetro urbano:&nbsp;</strong>AV-2/76.566, de 7 de outubro de 2021, com fundamento na Lei Municipal nº 6.512, de 27 de novembro de 2020.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Titularidade da VENDEDORA:&nbsp;</strong>R-3/76.566, de 20 de dezembro de 2024, pelo qual a gleba foi transferida ao patrimônio de LINO E CECÍLIO PARTICIPAÇÕES E INVESTIMENTOS LTDA.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Inscrição imobiliária municipal da gleba:&nbsp;</strong>nº 047269.000.0, conforme AV-4/76.566.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Servidão registrada:&nbsp;</strong>AV-1/76.566, referente à servidão permanente e irremovível sobre faixa de terreno com área total de 8.855,00 m², em favor da CEMIG DISTRIBUIÇÃO S.A. A eventual incidência sobre o lote objeto desta venda deverá constar da matrícula individual, do projeto e/ou da planta específica.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Aprovação municipal do empreendimento: Decreto nº <strong>14.382, de 2026.</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Registro do loteamento: <strong>R-5/76.566</strong> do Cartório de Registro de Imóveis da Comarca de Pará de Minas/MG.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Matrícula individual do lote: nº <strong>[numero_matricula].</strong></span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>V - PRAZO DE CONCLUSÃO E ENTREGA DAS OBRAS</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Termo final previsto no cronograma aprovado para conclusão das obras de infraestrutura: <strong>24 (vinte e quatro)</strong> meses, contados da data oficial de lançamento das vendas do empreendimento, ocorrida em <strong>1º de agosto de 2026</strong>, tendo como termo final previsto <strong>1º de agosto de 2028</strong>.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">A entrega será caracterizada pela conclusão das obras de responsabilidade da VENDEDORA, conforme o projeto e o memorial descritivo, seguida do respectivo protocolo perante os órgãos competentes, sem prejuízo da emissão dos termos de aceite exigíveis.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Não fica estabelecida tolerância automática e genérica de 180 (cento e oitenta) dias. Eventual prorrogação dependerá de hipótese de caso fortuito, força maior, ato ou omissão de órgão público/concessionária ou outra causa não imputável à VENDEDORA, devidamente comprovada e comunicada.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="color:black;font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>VI - PREÇO, FORMA DE PAGAMENTO E PARCELAMENTO DO PREÇO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>6.1. PREÇO DO LOTE:&nbsp;[valor_imovel_venda] ([valor_imovel_venda_extenso])</strong>.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>6.2. PREÇO TOTAL DA AQUISIÇÃO:&nbsp;[preco_venda] ([preco_venda_extenso])</strong>, considerando o preço do lote e a comissão de corretagem, esta será suportada pelo COMPRADOR e está discriminada neste Quadro-Resumo.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">[tabela_pagamentos]</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>VII - CORREÇÃO MONETÁRIA, JUROS E AMORTIZAÇÃO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Correção monetária:</strong> variação positiva do <strong>IPCA/IBGE</strong>, com periodicidade <strong>ANUAL</strong>, observada a defasagem técnica do índice e a data-base <strong>[data_emissao_contrato].</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Juros remuneratórios:</strong> <strong>0,7207% ao mês, equivalente a 9% ao ano efetivos</strong>, incidentes sobre o saldo devedor atualizado.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Sistema de amortização:</strong> <strong>SACOC</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Índices substitutivos, na falta ou impedimento do índice principal:</strong> <strong>IGP-M/FGV,&nbsp;</strong>&nbsp;sucessivamente, sempre vedada a utilização simultânea de dois índices para a mesma finalidade.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>Liquidação antecipada:</strong> o COMPRADOR poderá antecipar total ou parcialmente o débito, com redução proporcional dos juros e demais acréscimos referentes ao período antecipado.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Erros materiais de cálculo ou de digitação poderão ser corrigidos pela VENDEDORA a qualquer tempo, mediante apresentação de memória de cálculo, sem caracterizar alteração unilateral do contrato.&nbsp;</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Em caso de divergência decorrente de erro material entre a planilha financeira e este contrato, prevalecerão as condições econômicas expressamente previstas neste instrumento, promovendo-se a adequação da planilha.&nbsp;</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>VIII - COMISSÃO DE CORRETAGEM</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Valor da corretagem: <strong>[valor_total_comissao] ([valor_total_comissao_extenso])</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Responsável pelo pagamento: <strong>COMPRADOR</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Beneficiário(s):&nbsp;</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Nome: </span><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[nome_fantasia_coordenadora_vendas]</strong></span><br><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CNPJ: <strong>[cnpj_coordenadora_vendas]</strong></span><br><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CRECI: </span><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>8.015</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Percentual de Comissão de Corretagem: <strong>2%</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Valor de Comissão de Corretagem: </span><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[valor_pago_coordenadora_vendas]</strong></span><br><br><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Nome:<strong> [nome_vinculado]</strong></span><br><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CNPJ:<strong> [cpf_cnpj_vinculado]</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CRECI: <strong>[creci_vinculado]</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Percentual de Comissão de Corretagem: <strong>4%</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Valor de Comissão de Corretagem: </span><span class="text-big" style="color:hsl(0,0%,0%);font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[valor_corretagem_menos_coordenadora_vendas]</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Condições de pagamento: observado o fluxo de divisão e destinação dos valores correspondentes ao sinal, conforme estabelecido no item 6.1 deste instrumento.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>IX - POSSE E CONDIÇÕES PARA CONSTRUÇÃO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">A posse do lote somente será entregue após o cumprimento cumulativo das seguintes condições<strong>: (i)</strong> conclusão das obras de infraestrutura e emissão/protocolo dos termos de aceite exigíveis; <strong>(ii)</strong> adimplência integral das obrigações vencidas; <strong>(iii)</strong> pagamento de, no mínimo, <strong>30% (trinta por cento)</strong> do preço atualizado do lote; <strong>(iv)</strong> assinatura do Termo de Entrega de Posse e <strong>(v)</strong> desde que inexistam impedimentos legais ou administrativos não imputáveis à Vendedora.&nbsp;</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O início de qualquer obra dependerá, além da posse, da aprovação dos projetos e da emissão dos alvarás e licenças pelo Município e pelos demais órgãos competentes, bem como do respeito à destinação urbanística específica do lote.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Após a entrega da posse, o COMPRADOR responderá integralmente pela guarda, conservação, manutenção, limpeza e segurança do lote, bem como por todos os tributos, encargos e responsabilidades decorrentes de sua utilização, ressalvadas as obrigações que, por lei ou por este contrato, permaneçam atribuídas à Vendedora.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>X - INADIMPLÊNCIA DO COMPRADOR E CONSTITUIÇÃO EM MORA</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O atraso de qualquer parcela gera os encargos moratórios previstos neste contrato e autoriza a VENDEDORA a iniciar as medidas extrajudiciais e/ou judiciais cabíveis, inclusive cobrança, protesto, inscrição nos cadastros de inadimplentes e procedimento de resolução contratual, na forma autorizada pela Lei.&nbsp;</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O(s) COMPRADOR(ES) será(ão) formalmente constituído(s) em mora e terá(ão) prazo de 30 (trinta) dias para regularizar integralmente o débito, mediante pagamento das parcelas vencidas e das que se vencerem até a data do pagamento, acrescidas dos encargos e custas legalmente exigíveis.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Não purgada a mora, a VENDEDORA poderá manter o contrato e cobrar o débito ou considerar o contrato resolvido, adotando as medidas cabíveis para <strong>eventual&nbsp;</strong>cancelamento do registro, retomada do lote e aplicação das consequências previstas no item XI.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">As penalidades e consequências do desfazimento exigem ciência prévia e específica do(s) COMPRADOR(ES), mediante assinatura destacada ao final deste Quadro-Resumo.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>XI - CONSEQUÊNCIAS DA RESOLUÇÃO POR INADIMPLEMENTO DO COMPRADOR</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Resolvido o contrato por fato imputado ao COMPRADOR, os valores pagos serão atualizados pelo índice contratual, podendo ser deduzidos, nos limites legais: <strong>(a)</strong> fruição de até 0,75% ao mês sobre o valor atualizado do contrato, pro rata die, somente se a posse tiver sido entregue<strong>; (b)</strong> cláusula penal e despesas administrativas, inclusive arras ou sinal, limitadas em conjunto a 10% do valor atualizado do contrato; <strong>(c)</strong> encargos moratórios<strong>; (d)</strong> débitos de IPTU, contribuições, tarifas, tributos, custas e emolumentos vinculados ao lote ou à rescisão; e <strong>(e)</strong> comissão de corretagem.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">A restituição do saldo apurado ocorrerá em até <strong>12 (doze) parcelas mensais</strong>. Em loteamento com obras em andamento, o início observará o prazo máximo de 180 (cento e oitenta) dias após o termo final previsto para conclusão das obras; em loteamento com&nbsp;obras concluídas, o início observará o prazo máximo de 12 (doze) meses após a formalização da rescisão, salvo condição mais favorável pactuada por escrito.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>XII - INADIMPLEMENTO DA VENDEDORA E ATRASO NA ENTREGA</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Se a VENDEDORA der causa exclusiva ao inadimplemento absoluto, inclusive pela não entrega das obras no prazo contratual sem justificativa legal ou contratual, o COMPRADOR poderá optar por: <strong>(a)</strong> resolver o contrato, recebendo os valores pagos devidamente atualizados, acrescidos <strong>multa compensatória equivalente a 10% (dez por cento) sobre o valor atualizado do Contrato</strong>; ou <strong>(b)</strong> manter o contrato, fazendo jus à <strong>indenização moratória de 0,5% (cinco décimos por cento) ao mês sobre o valor atualizado do Contrato, calculada pro rata die</strong>, a partir do primeiro dia subsequente ao término do prazo contratual aplicável até a efetiva disponibilização do lote nas condições previstas neste instrumento.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Nenhuma indenização compreenderá lucros cessantes presumidos ou danos indiretos, devendo ser comprovados.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Somente haverá mora da Vendedora quando ultrapassado o prazo contratual sem ocorrência de qualquer hipótese suspensiva prevista neste contrato.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">As penalidades previstas neste item não serão cumuladas entre si e deverão ser validadas pelo jurídico quanto à base de cálculo e ao equilíbrio contratual.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>XIII - DIREITO DE ARREPENDIMENTO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O direito de arrependimento poderá ser exercido em até 7 (sete) dias corridos quando a contratação ocorrer em estande de vendas ou fora da sede da VENDEDORA ou de seu estabelecimento comercial, mediante comunicação formal, com restituição dos valores pagos na forma da lei.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Não se aplica automaticamente o direito de arrependimento aos contratos celebrados na sede da VENDEDORA, sem prejuízo de outras hipóteses legais.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>XIV - TRIBUTOS, CONTRIBUIÇÕES E ENTIDADE DE GESTÃO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">ITBI, emolumentos, registro, escritura e despesas de transferência serão suportados pelo COMPRADOR.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">O IPTU será pago diretamente pela VENDEDORA perante a Prefeitura Municipal enquanto o lançamento ou a guia permanecer em seu nome. Os valores referentes ao período de responsabilidade do COMPRADOR, iniciado a partir da entrega da posse ou da alteração cadastral perante o Município, o que ocorrer primeiro, serão cobrados do COMPRADOR conforme o fluxo financeiro, o calendário, o parcelamento e os vencimentos definidos pela Prefeitura, mediante boleto específico ou inclusão na cobrança contratual subsequente, com disponibilização da respectiva guia ou demonstrativo, sem acréscimo. Multas e juros causados exclusivamente por atraso da VENDEDORA não serão repassados. A VENDEDORA se reserva no direito de enviar boleto específico do reembolso dos tributos sobre o imóvel negociado figurando um terceiro beneficiário autorizado por esta.</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Havendo associação de proprietários ou entidade administradora regularmente constituída, sua identificação será enviada posteriormente ao COMPRADOR para analisar sua adesão. As contribuições e regras aplicáveis observarão os documentos entregues ao COMPRADOR e a legislação vigente.</span></p></td></tr><tr><td style="border:1px solid hsl(0, 0%, 0%);"><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>XV - DOCUMENTOS INTEGRANTES</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">Integram este contrato, quando aplicáveis: <strong>(a)</strong> Certidão atualizada da Matrícula originária nº 76.566; <strong>(b)</strong> Termo de Ciência e Recebimento de Documentos; <strong>(c)</strong> Contrato de Corretagem.</span></p></td></tr><tr><td style="background-color:#D9D9D9;border:1px solid hsl(0, 0%, 0%);padding:0cm 5.4pt;vertical-align:top;width:523.1pt;"><p style="text-align:center;"><span class="text-big" style="color:black;font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>CIÊNCIA PRÉVIA E ESPECÍFICA SOBRE AS CONSEQUÊNCIAS DO DESFAZIMENTO</strong></span></p><p style="text-align:justify;"><span class="text-big" style="color:black;font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>O(s) COMPRADOR(ES) declara(m) que leu(ram), compreendeu(ram) e concorda(m) especificamente com os itens X, XI e XII deste Quadro-Resumo, especialmente quanto às penalidades, deduções e prazos de restituição.</strong></span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">(Assinado eletronicamente)</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">[inicio_dados_cliente_pf]<strong>[nome_cliente] </strong>[inicio_dados_conjuge][fim_dados_conjuge]&nbsp;[fim_dados_cliente_pf] [inicio_dados_cliente_pj] <strong>[nome_fantasia_cliente]</strong> [fim_dados_cliente_pj]</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">COMPROMISSÁRIO(A) COMPRADOR(A)</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">[inicio_dados_cliente_pf] [inicio_dados_conjuge]</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">(Assinado eletronicamente)</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[nome_conjuge]</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CONJUGE[fim_dados_conjuge]&nbsp;[fim_dados_cliente_pf] [inicio_dados_cliente_pj][fim_dados_cliente_pj]</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">[inicio_dados_cliente_2]&nbsp;[inicio_dados_cliente_pf_2]</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">(Assinado eletronicamente)</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[nome_cliente_2] </strong>[inicio_dados_conjuge_2][fim_dados_conjuge_2] [fim_dados_cliente_pf_2] [inicio_dados_cliente_pj_2] <strong>[nome_fantasia_cliente_2]</strong>[fim_dados_cliente_pj_2]</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">COMPROMISSÁRIO(A) COMPRADOR(A)[fim_dados_cliente_pf_2]&nbsp;</span></p><p style="text-align:justify;"><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">[inicio_dados_cliente_2]&nbsp;[inicio_dados_cliente_pf_2][inicio_dados_conjuge_2]</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">(Assinado eletronicamente)</span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;"><strong>[nome_conjuge_2]</strong></span><br><span class="text-big" style="font-family:'Lucida Sans Unicode', 'Lucida Grande', sans-serif;">CONJUGE[fim_dados_conjuge_2][fim_dados_cliente_pf_2][fim_dados_cliente_2]&nbsp;</span></p></td></tr></tbody></table></figure>
