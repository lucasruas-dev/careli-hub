<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reestruturação C&amp;R</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --navy:#10222c; --navy2:#163d57; --blue:#2d84b8; --blue2:#1b6391; --sky:#89bcca; --gray:#49464e;
  --bg:#f6f8fa; --card:#ffffff; --ink:#1c2328; --muted:#6b7680; --line:#e2e7ec; --soft:#e8f2f8;
  --ok:#1f9d55; --doing:#e8912d; --todo:#2d84b8; --late:#d64545;
}
*{box-sizing:border-box}
.selo{display:inline-block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:#fff;color:var(--ink);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
aside .brand{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 8px 14px;border-bottom:1px solid var(--line)}
aside .brand .selo{box-shadow:none;padding:0}aside .brand img{width:64px;display:block}aside .brand > div{text-align:center}
aside .brand b{font-family:Marcellus,serif;font-weight:400;font-size:15px;letter-spacing:.06em;color:var(--navy2);display:block}
aside .brand span{font-size:11px;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#3a4650;font-size:14.5px;font-weight:500}
nav button svg{width:17px;height:17px}
nav button:hover{background:#f1f5f8;color:var(--navy2)}
nav button.on{background:#e6f1f8;color:var(--blue2);font-weight:600}
aside .foot{margin-top:auto;font-size:11.5px;color:var(--muted);padding:12px 8px 0;border-top:1px solid var(--line)}
aside .foot b{color:var(--navy2);font-weight:600}
main{padding:28px 34px 60px;max-width:1360px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{margin:0;font-size:22px}
.top p{margin:2px 0 0;color:var(--muted)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;border-radius:99px;padding:8px 16px}
.btn.ghost{background:#fff;color:var(--navy2);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
h2{font-size:15px;margin:0 0 12px;color:var(--navy2)}
h3{font-size:13px;margin:0 0 8px;color:var(--blue2);text-transform:uppercase;letter-spacing:.05em}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin:4px 0}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--blue2);font-weight:600}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle}
.s-todo{background:var(--todo)} .s-doing{background:var(--doing)} .s-ok{background:var(--ok)} .s-late{background:var(--late)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.empty{color:#9aa5ae;font-style:italic}

/* capa */
.cover{position:relative;border-radius:18px;overflow:hidden;background:
  radial-gradient(1200px 500px at 85% -10%, rgba(45,132,184,.55), transparent 60%),
  linear-gradient(135deg,var(--navy) 0%,var(--navy2) 70%,var(--blue2) 100%);color:#fff;padding:44px 48px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between}
.cover:after{content:"";position:absolute;right:-60px;bottom:-80px;width:420px;height:420px;background:url(/marcas/cecilio-rocha.svg) no-repeat center/contain;opacity:.10}
.cover .logo{display:flex;align-items:center;gap:16px}
.cover .logo .selo{padding:12px 14px;border-radius:14px}.cover .logo img{width:104px;display:block}
.cover .logo{justify-content:space-between;align-items:flex-start}.cover .logo > div{text-align:right}.cover .logo b{font-weight:600;font-size:15px;display:block}
.cover .logo span{font-size:12px;letter-spacing:.3em;color:var(--sky)}
.cover h1{font-family:Marcellus,serif;font-weight:400;font-size:40px;margin:34px 0 6px;letter-spacing:.01em}
.cover p{margin:0;color:#cfe0ea;font-size:15px;max-width:720px}
.cover .meta{display:flex;gap:34px;margin-top:30px;font-size:12.5px;color:#a9c4d4}
.cover .meta b{display:block;color:#fff;font-size:14px;font-weight:600}

.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-size:26px;color:var(--navy2)}
.kpi span{font-size:12px;color:var(--muted)}

/* fases */
.fase{border-left:4px solid var(--blue);padding-left:14px}
.fase .n{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.06em}
.fase h4{margin:2px 0 8px;font-size:15px}

/* frentes grid */
.frente{cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:10px}
.frente:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(22,61,87,.08)}
.frente .hd{display:flex;align-items:center;gap:10px}
.frente .ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--blue2)}
.frente .ic svg{width:19px;height:19px}
.frente b{font-size:15px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* painel da frente: o slide */
.slide{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.slide .band{background:linear-gradient(90deg,var(--blue2),var(--blue));color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 22px 0}
.slide .band h2{color:#fff;font-size:26px;margin:0;font-weight:600}
.slide .band .selo{padding:4px 6px;border-radius:8px}.slide .band img{height:44px;display:block}
.slide .body{padding:22px 26px 26px;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:0}
.slide .col{padding:0 22px;border-left:1px solid var(--line)}
.slide .col:first-child{padding-left:0;border-left:0}
.slide .col h3{text-transform:none;letter-spacing:0;font-size:16px;color:var(--blue2)}
.farol td{padding:8px 10px}
.farol tr:nth-child(odd) td{background:#e9f6fc}
.farol td:last-child{text-align:center;width:60px}
.pf{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
.pf .ci{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--blue)}
.pf .ci svg{width:16px;height:16px}
.slide .lower{display:grid;grid-template-columns:1fr 1.3fr;border-top:1px solid var(--line);margin:0 26px;padding:18px 0 22px}
.slide .lower > div:last-child{border-left:1px solid var(--line);padding-left:22px}
.slide .rule{height:5px;background:var(--blue);margin:0 26px 18px;border-radius:3px}

/* gantt */
.gantt{display:grid;grid-template-columns:220px repeat(12,1fr);font-size:12px}
.gantt .h{padding:6px 4px;color:var(--muted);font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
.gantt .l{padding:8px 8px 8px 0;border-bottom:1px solid #f0f3f5;font-weight:500}
.gantt .l.sub{padding-left:14px;font-weight:400;color:var(--muted)}
.gantt .c{border-bottom:1px solid #f0f3f5;border-left:1px dashed #eef1f4;position:relative;min-height:34px}
.gantt .b{position:absolute;top:9px;height:16px;border-radius:5px}
.gantt .now{background:rgba(45,132,184,.06)}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:22px 0 16px}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--blue2);border-color:var(--blue)}

.crumb{all:unset;cursor:pointer;color:var(--blue2);font-size:13px;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.crumb svg{width:15px;height:15px}
.rule-box{background:#fff8ec;border:1px solid #f3dcb3;border-radius:12px;padding:14px 16px;color:#6b4a14;display:flex;gap:10px}
.rule-box svg{flex:none;width:18px;height:18px;margin-top:2px}

/* relatório */
.report{background:#fff;border:1px solid var(--line);border-radius:14px;padding:40px 48px;max-width:980px}
.report header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--blue);padding-bottom:18px;margin-bottom:22px}
.report header h1{font-family:Marcellus,serif;font-weight:400;font-size:24px;margin:0;color:var(--navy2)}
.report header img{height:70px}
.report .ident{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 30px;font-size:13px}
.report h2{margin:28px 0 10px;font-size:15px;border-left:4px solid var(--blue);padding-left:10px}
.report .setor{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.report .setor h4{margin:0 0 8px;color:var(--blue2);font-size:13px;letter-spacing:.05em}
.report .setor .row{display:grid;grid-template-columns:170px 1fr;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.report .setor .row:first-of-type{border-top:0}
.report .setor .row b{color:var(--gray);font-weight:600}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:50px;text-align:center;font-size:12.5px;color:var(--muted)}
.sign div{border-top:1px solid var(--ink);padding-top:6px}
.check{display:flex;gap:22px;font-size:13px}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}

/* modo apresentação */
body.present aside, body.present .top .actions{display:none}
body.present .app{grid-template-columns:1fr}
body.present main{max-width:none;padding:26px 48px}
.present-hint{display:none;position:fixed;bottom:14px;right:18px;background:var(--navy);color:#fff;padding:6px 12px;border-radius:8px;font-size:12px;opacity:.85}
body.present .present-hint{display:block}

@media print{
  aside,.top,.noprint{display:none!important}
  .app{display:block} main{padding:0;max-width:none}
  body{background:#fff}
  .report{border:0;padding:0;max-width:none}
  .report .setor{break-inside:avoid}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr} aside{position:static;height:auto}
  .g2,.g3,.g4,.slide .body,.slide .lower{grid-template-columns:1fr}
  .slide .col,.slide .lower > div:last-child{border-left:0;padding:12px 0}
  main{padding:18px 16px}
  .gantt{overflow-x:auto}
}
</style>
<style>
/* ---- edição (só aparece para o consultor, com o modo edição ligado) ---- */
.lapis{all:unset;cursor:pointer;display:none;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--blue);padding:2px 8px;border-radius:6px;border:1px dashed #b8d4e6;margin-left:8px;vertical-align:middle;background:#fff}
.lapis svg{width:13px;height:13px}
body.editando .lapis{display:inline-flex}
body.editando .dot.clica{cursor:pointer;outline:2px solid transparent;transition:.1s}
body.editando .dot.clica:hover{outline-color:#b8d4e6;outline-offset:2px}
.slide .band .lapis{color:#fff;background:transparent;border-color:rgba(255,255,255,.5)}
aside .modo{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-top:1px solid var(--line)}
aside .modo button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#3a4650;padding:7px 10px;border-radius:99px;border:1px solid var(--line)}
aside .modo button:hover{background:#f1f5f8}
aside .modo button.on{background:var(--blue);border-color:var(--blue);color:#fff}
aside .modo svg{width:15px;height:15px}
.salvo{font-size:11.5px;color:var(--muted);padding:0 8px;min-height:16px}
.salvo.erro{color:var(--late)}
.faixa{position:sticky;top:0;z-index:20;margin:-28px -34px 18px;padding:10px 34px;background:#fff4e5;border-bottom:1px solid #f3dcb3;color:#6b4a14;font-size:13px;display:none;align-items:center;gap:10px}
.faixa.on{display:flex}
.faixa button{all:unset;cursor:pointer;font-weight:600;text-decoration:underline}
.modal-fundo{position:fixed;inset:0;background:rgba(16,34,44,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal-fundo.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(980px,100%);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px}
.modal .dica{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.modal table td{padding:4px 4px;border-bottom:0}
.modal input,.modal select,.modal textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}
.modal textarea{min-height:64px;resize:vertical}
.modal .rodape{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.modal .icone-btn{all:unset;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:inline-grid;place-items:center}
.modal .icone-btn:hover{background:var(--bg);color:var(--late)}
.modal .icone-btn svg{width:16px;height:16px}
.porta{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:24px}
.porta .selo{padding:14px;border-radius:16px;margin-bottom:20px}
.porta img{width:110px;display:block}
.porta p{color:#cfe0ea;max-width:420px}
.porta a{color:#fff;font-weight:600}
.fechado{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok);background:#e7f6ee;border-radius:99px;padding:3px 10px}
.fechado svg{width:14px;height:14px}
@media print{.faixa,.lapis,.modal-fundo{display:none!important}}

/* =================== APRESENTAÇÃO (deck 16:9, base 1600x900) =================== */
.deck-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.deck-bar .ctl{display:flex;align-items:center;gap:8px}
.deck-bar .num{font-size:13px;color:var(--muted);min-width:70px;text-align:center}
.palco{position:relative;width:100%;aspect-ratio:16/9;background:#0b1a22;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(16,34,44,.18)}
.palco .sl{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.miniaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.miniaturas button{all:unset;cursor:pointer;position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:2px solid transparent;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.miniaturas button.on{border-color:var(--blue)}
.miniaturas .sl{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
.miniaturas i.n{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);background:rgba(255,255,255,.9);padding:0 5px;border-radius:4px;z-index:2}
.palco:fullscreen{border-radius:0;background:#000;display:flex;align-items:center;justify-content:center}
.palco:fullscreen .sl{position:relative}
.palco .seta{position:absolute;top:0;bottom:0;width:18%;cursor:pointer;z-index:5}
.palco .seta.esq{left:0}.palco .seta.dir{right:0}
#impressao{display:none}

/* ---- o slide ---- */
.sl{position:relative;width:1600px;height:900px;flex:none;font-family:Inter,system-ui,sans-serif;color:#1c2328;background:#fff;overflow:hidden}
.sl h1,.sl h2,.sl h3{margin:0;text-transform:none;letter-spacing:normal;color:inherit}
.sl .serif{font-family:Marcellus,serif;font-weight:400}
.sl .olho{font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);font-weight:600}
.sl .titulo{font-family:Marcellus,serif;font-weight:400;font-size:54px;color:var(--navy2);line-height:1.1;margin-top:10px}
.sl .conteudo{position:absolute;left:90px;right:90px;top:200px;bottom:104px}
.sl .topo{position:absolute;left:90px;right:90px;top:70px;display:flex;justify-content:space-between;align-items:flex-start}
.sl .topo img{height:74px}
.sl .rodape{position:absolute;left:90px;right:90px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#8a96a0;border-top:2px solid #e6edf2;padding-top:16px}
.sl .rodape b{color:var(--navy2);font-weight:600}
.sl .faixa-lat{position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(180deg,var(--blue),var(--navy2))}
.sl svg.lucide{stroke-width:1.7}

/* capa */
.sl.capa{background:radial-gradient(1100px 700px at 88% -10%,rgba(45,132,184,.55),transparent 60%),linear-gradient(135deg,#0c1b24 0%,var(--navy2) 65%,var(--blue2) 100%);color:#fff}
.sl.capa .marca-dagua{position:absolute;right:-120px;bottom:-160px;width:820px;height:820px;background:url(/marcas/cecilio-rocha.svg) no-repeat center/contain;opacity:.07;filter:grayscale(1) brightness(3)}
.sl.capa .linhas{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.035) 120px 122px)}
.sl.capa .selo-g{position:absolute;left:110px;top:100px;background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sl.capa .selo-g img{width:170px;display:block}
.sl.capa .miolo{position:absolute;left:110px;right:110px;top:390px}
.sl.capa .miolo .olho{color:var(--sky)}
.sl.capa h1{font-family:Marcellus,serif;font-weight:400;font-size:98px;line-height:1.02;margin-top:18px;letter-spacing:-.01em}
.sl.capa .sub{font-size:26px;color:#cfe0ea;margin-top:22px;max-width:1100px;line-height:1.45}
.sl.capa .meta{position:absolute;left:110px;right:110px;bottom:80px;display:flex;gap:80px;font-size:16px;color:#9fc0d3;border-top:1px solid rgba(255,255,255,.15);padding-top:26px}
.sl.capa .meta b{display:block;color:#fff;font-size:22px;font-weight:600;margin-top:6px}

/* divisor de seção */
.sl.divisor{background:linear-gradient(120deg,#0c1b24 0%,var(--navy2) 60%,var(--blue2) 100%);color:#fff}
.sl.divisor .grande{position:absolute;left:100px;top:120px;font-family:Marcellus,serif;font-size:300px;line-height:1;color:rgba(255,255,255,.08)}
.sl.divisor .bloco{position:absolute;left:110px;right:110px;top:380px}
.sl.divisor .olho{color:var(--sky)}
.sl.divisor h2{font-family:Marcellus,serif;font-weight:400;font-size:84px;line-height:1.05;margin-top:16px}
.sl.divisor .per{font-size:26px;color:#cfe0ea;margin-top:20px}
.sl.divisor .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.sl.divisor .chips span{display:flex;align-items:center;gap:10px;font-size:22px;padding:12px 22px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.sl.divisor .chips svg{width:24px;height:24px}
.sl.divisor .selo-p{position:absolute;right:100px;top:90px;background:#fff;border-radius:16px;padding:10px 12px}
.sl.divisor .selo-p img{width:96px;display:block}

/* blocos de conteúdo */
.sl .cards{display:grid;gap:26px;height:100%}
.sl .card-s{background:#f5f8fa;border-radius:20px;padding:28px 30px;display:flex;flex-direction:column;gap:12px;border:1px solid #e6edf2;min-height:0}
.sl .card-s .ico{width:62px;height:62px;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--blue);box-shadow:0 4px 14px rgba(22,61,87,.08)}
.sl .card-s .ico svg{width:32px;height:32px}

<body>
<div id="raiz"><div class="porta"><div><span class="selo"><img src="/marcas/cecilio-rocha.svg" alt=""></span><p>Carregando…</p></div></div></div>
<div class="modal-fundo" id="modal"></div>
<div class="present-hint">← → navegar · Esc sair</div>

<script>
// =====================================================================================
// A CONSULTORIA · tela de trabalho e de apresentação (c2x.app.br/consultoria/<slug>)
// O desenho é o mockup aprovado pelo Lucas em 29/09/2026. Os dados vêm da API:
//   • ?e=<código> (guardado no navegador) → consultor, lê e salva
//   • ?t=<código>                         → cliente, só leitura
// Os dois pela mesma porta, /api/publico/consultoria/<slug>, com o código no cabeçalho.
// =====================================================================================
const SLUG = location.pathname.split('/').filter(Boolean).pop();
const TOKEN_DO_LINK = new URLSearchParams(location.search).get('t') || '';
const STATUS = {todo:'A iniciar', doing:'Em desenvolvimento', ok:'Concluído', late:'Atrasado'};
const CICLO = {todo:'doing', doing:'ok', ok:'late', late:'todo'};
const MESES_LONGOS = ['Outubro/2026','Novembro/2026','Dezembro/2026','Janeiro/2027','Fevereiro/2027','Março/2027','Abril/2027','Maio/2027','Junho/2027','Julho/2027','Agosto/2027','Setembro/2027'];
const TIPOS_DE_REGISTRO = [['problema','Problemas e gargalos identificados'],['acao','Ações realizadas'],['resultado','Resultados obtidos']];

let DOC=null, ATUALIZADO=null, PODE_EDITAR=false, LINK_DE_LEITURA='';
let PROJETO,MESES,FASES,ONDAS,FRENTES,INDICADORES,PLANO30,GOVERNANCA;
let MES_ATUAL=0;
let estado = {secao:'geral',frente:null,aba:'painel',mesRel:0,mesReg:0};

// ATUALIZAÇÕES DO DOCUMENTO. O projeto mora no banco e é editado pela tela; quando o PLANO muda
// (não a tela), a mudança entra aqui, numerada, e é aplicada uma única vez na abertura do
// consultor, que salva. Para o cliente ela vale só na memória.
function atualizarDocumento(){
  let mudou_=false;
  const v=DOC.versao||1;
  if(v<2){
    // Lucas, 29/09/2026: "primeiro, vamos atacar o administrativo (financeiro, RH, Contratos)
    // Comercial - Depois obras suprimentos depois tecnologia".
    if(!DOC.frentes.some(f=>f.id==='contratos')){
      const i=DOC.frentes.findIndex(f=>f.id==='financeiro');
      DOC.frentes.splice(i<0?DOC.frentes.length:i+1,0,{id:'contratos',grupo:'Setor',setor:'ADMINISTRATIVO / PROCESSOS',nome:'Contratos',icone:'file-pen-line',
        objetivo:'Contrato redondo do fechamento ao arquivo: minutas padrão, aprovação por alçada, assinatura e controle de vigência e obrigações.',
        escopo:['Contratos com clientes (compra e venda)','Contratos com fornecedores e empreiteiros','Minutas padrão e cláusulas aprovadas','Fluxo de aprovação e assinatura','Controle de vigência, aditivos e obrigações'],
        entregas:[{nome:'Fluxo de contratos',tipo:'Processo',status:'todo',link:''},{nome:'Biblioteca de minutas padrão',tipo:'Documento',status:'todo',link:''},{nome:'Controle de contratos e vencimentos',tipo:'Ferramenta',status:'todo',link:''}],
        atividades:[{nome:'Acompanhamento do dia a dia (processo real)',status:'todo',prazo:'30/10'},{nome:'Levantamento dos contratos vigentes e modelos em uso',status:'todo',prazo:'30/10'},{nome:'Mapa do processo atual (as-is)',status:'todo',prazo:'13/11'}],
        janela:{redesenho:[2,3],implantacao:[4,6]},kpis:[],principais:[],proximos:[],pontos:[],registros:[],implantados:[]});
    }
    const J={financeiro:[[2,3],[4,6]],rh:[[2,3],[4,6]],contratos:[[2,3],[4,6]],comercial:[[2,4],[5,7]],organograma:[[2,3],[4,5]],papeis:[[2,4],[4,6]],indicadores:[[1,3],[3,11]],obras:[[4,6],[7,9]],suprimentos:[[4,6],[7,9]],tecnologia:[[7,8],[9,11]]};
    DOC.frentes.forEach(f=>{if(J[f.id]){f.janela={redesenho:J[f.id][0],implantacao:J[f.id][1]};
      if(f.principais&&f.principais[2]&&/^Redesenho em /.test(f.principais[2]))f.principais[2]=`Redesenho em ${DOC.meses[J[f.id][0][0]]} a ${DOC.meses[J[f.id][0][1]]}`;}});
    DOC.ondas=[
      {nome:'Onda 1',titulo:'Administrativo e Comercial',descricao:'A base da gestão: caixa, pessoas, contratos e a venda, com a estrutura e os papéis que sustentam tudo.',meses:[2,7],frentes:['financeiro','rh','contratos','comercial','organograma','papeis','indicadores']},
      {nome:'Onda 2',titulo:'Obras e Suprimentos',descricao:'A obra planejada e a compra puxada pelo cronograma.',meses:[4,9],frentes:['obras','suprimentos']},
      {nome:'Onda 3',titulo:'Tecnologia',descricao:'Sistemas a serviço dos processos já redesenhados.',meses:[7,11],frentes:['tecnologia']},
    ];
    DOC.versao=2; mudou_=true;
  }
  return mudou_;
}

function vincular(){
  vincular.atualizou=atualizarDocumento();
  ({projeto:PROJETO,meses:MESES,fases:FASES,ondas:ONDAS,frentes:FRENTES,indicadores:INDICADORES,plano30:PLANO30,governanca:GOVERNANCA}=DOC);
  DOC.pendencias = DOC.pendencias || {consultoria:[],gestores:[],diretoria:[],decisoes:[]};
  DOC.relatorios = DOC.relatorios || {};
  FRENTES.forEach(f=>{f.registros=f.registros||[];f.implantados=f.implantados||[];f.pontos=f.pontos||[];f.principais=f.principais||[];f.proximos=f.proximos||[];});
  const [ano,mes]=(PROJETO.inicioMes||'2026-10').split('-').map(Number);
  const hoje=new Date();
  MES_ATUAL=Math.max(0,Math.min(11,(hoje.getFullYear()-ano)*12+(hoje.getMonth()+1-mes)));
}

// ---------------------------------------------------------------- acesso por link (sem login)
// Link do consultor: /consultoria/<slug>?e=<código>. Na primeira abertura o código vai para o
// localStorage deste navegador e sai da barra de endereço; daí em diante o endereço limpo abre
// direto em modo edição. Link do cliente: ?t=<código>, só leitura.
const CHAVE_EDICAO = `consultoria-edicao-${SLUG}`;
function lerEdicao(){ try{return localStorage.getItem(CHAVE_EDICAO)||'';}catch{return '';} }
function guardarEdicao(v){ try{ v?localStorage.setItem(CHAVE_EDICAO,v):localStorage.removeItem(CHAVE_EDICAO); }catch{} }
let CODIGO_EDICAO='';
(function(){
  const q=new URLSearchParams(location.search), e=q.get('e');
  if(e){ guardarEdicao(e); q.delete('e'); history.replaceState(null,'',location.pathname+(q.toString()?`?${q}`:'')); }
  CODIGO_EDICAO=lerEdicao();
})();
const cabecalhos=()=>CODIGO_EDICAO?{'x-consultoria-edicao':CODIGO_EDICAO}:{'x-consultoria-token':TOKEN_DO_LINK};

async function carregar(){
  if(!CODIGO_EDICAO && !TOKEN_DO_LINK) return porta('');
  let r;
  try{ r=await fetch(`/api/publico/consultoria/${SLUG}`,{headers:cabecalhos(),cache:'no-store'}); }
  catch{return porta('Não foi possível conectar. Verifique a internet e recarregue a página.');}
  if(r.status===404){ if(CODIGO_EDICAO) guardarEdicao(''); return porta('Link inválido ou expirado. Peça um novo link ao consultor.'); }
  if(!r.ok) return porta('Não foi possível abrir o projeto agora. Tente de novo em instantes.');
  const j=await r.json();
  DOC=j.dados; ATUALIZADO=j.atualizadoEm; PODE_EDITAR=!!j.podeEditar; LINK_DE_LEITURA=j.linkDeLeitura||'';
  vincular();
  estado.mesRel=MES_ATUAL; estado.mesReg=MES_ATUAL;
  montarApp(); render();
  if(vincular.atualizou) mudou();
}
function porta(msg){
  document.getElementById('raiz').innerHTML=`<div class="porta"><div><span class="selo"><img src="/marcas/cecilio-rocha.svg" alt="Cecílio Rocha Construtora"></span><h2 style="font-family:Marcellus,serif;font-weight:400;font-size:26px;margin:0 0 8px;color:#fff">Reestruturação de Processos</h2>${msg?`<p>${msg}</p>`:''}</div></div>`;
}

// ---------------------------------------------------------------- salvamento
let timerSalvar=null, salvando=false, pendente=false, travado=false;
function mudou(){ if(!PODE_EDITAR||travado)return; pendente=true; marcaSalvo('Alterações não salvas…'); clearTimeout(timerSalvar); timerSalvar=setTimeout(salvar,900); }
async function salvar(){
  if(salvando){timerSalvar=setTimeout(salvar,500);return;}
  if(!pendente)return;
  salvando=true; pendente=false; marcaSalvo('Salvando…');
  try{
    const r=await fetch(`/api/publico/consultoria/${SLUG}`,{method:'PUT',headers:{...cabecalhos(),'content-type':'application/json'},body:JSON.stringify({dados:DOC,base:ATUALIZADO})});
    if(r.status===409){travado=true;faixa('Este projeto foi alterado em outra janela. Para não apagar aquele trabalho, esta aba parou de salvar.','Recarregar',()=>location.reload());marcaSalvo('Não salvo',true);return;}
    if(r.status===404){travado=true;faixa('O link de edição deste navegador não vale mais. A última alteração NÃO foi salva.');marcaSalvo('Não salvo',true);return;}
    if(!r.ok){pendente=true;marcaSalvo('Erro ao salvar · tentando de novo',true);timerSalvar=setTimeout(salvar,5000);return;}
    ATUALIZADO=(await r.json()).atualizadoEm; marcaSalvo('Salvo');
  }catch{pendente=true;marcaSalvo('Sem conexão · tentando de novo',true);timerSalvar=setTimeout(salvar,5000);}
  finally{salvando=false;}
}
function marcaSalvo(t,erro=false){const el=document.getElementById('salvo');if(el){el.textContent=t;el.className='salvo'+(erro?' erro':'');}}
function faixa(msg,botao,acao){const el=document.getElementById('faixa');if(!el)return;if(!msg){el.className='faixa';return;}el.innerHTML=`${ic('alert-triangle')}<span>${msg}</span>${botao?`<button id="faixa-btn">${botao}</button>`:''}`;el.className='faixa on';if(botao)document.getElementById('faixa-btn').onclick=acao;lucide.createIcons();}
window.addEventListener('beforeunload',e=>{if(pendente||salvando){e.preventDefault();e.returnValue='';}});

// ---------------------------------------------------------------- utilitários de tela
const $ = s=>document.querySelector(s);
const ic = (n,cls='')=>`<i data-lucide="${n}" class="${cls}"></i>`;
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vazio = (t='Sem registro no período')=>`<span class="empty">${t}</span>`;
const lista = arr=>arr&&arr.length?`<ul class="clean">${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:vazio();
// Ações de edição registradas por render: o botão guarda só o índice, a função fica aqui.
let ACOES=[];
const acao = fn=>{ACOES.push(fn);return ACOES.length-1;};
const lapis = (fn,rot='Editar')=>PODE_EDITAR?`<button class="lapis noprint" onclick="event.stopPropagation();ACOES[${acao(fn)}]()">${ic('pencil')}${rot}</button>`:'';
// Bolinha de status: no modo edição, clicar avança o status (A iniciar → Em desenvolvimento → Concluído → Atrasado).
const dot = (s,obj)=>obj&&PODE_EDITAR?`<span class="dot s-${s} clica" title="${STATUS[s]} · clique para mudar" onclick="if(document.body.classList.contains('editando')){event.stopPropagation();ACOES[${acao(()=>{obj.status=CICLO[obj.status]||'todo';mudou();render();})}]()}"></span>`:`<span class="dot s-${s}" title="${STATUS[s]}"></span>`;

// ---------------------------------------------------------------- editor genérico (tabela)
// colunas: {k, rotulo, tipo:'texto'|'longo'|'status'|'mes'|'numero'|'opcoes', opcoes:[[valor,rotulo]], largura}
function editarTabela({titulo,dica,colunas,linhas,nova,aoSalvar}){
  const copia=linhas.map(l=>({...l}));
  const fundo=$('#modal');
  const campo=(c,v,i)=>{
    const at=`data-i="${i}" data-k="${c.k}"`;
    if(c.tipo==='longo')return `<textarea ${at}>${esc(v)}</textarea>`;
    if(c.tipo==='status')return `<select ${at}>${Object.entries(STATUS).map(([k,n])=>`<option value="${k}" ${v===k?'selected':''}>${n}</option>`).join('')}</select>`;
    if(c.tipo==='mes')return `<select ${at}>${MESES.map((m,j)=>`<option value="${j}" ${+v===j?'selected':''}>${m}</option>`).join('')}</select>`;
    if(c.tipo==='opcoes')return `<select ${at}>${c.opcoes.map(([k,n])=>`<option value="${esc(k)}" ${String(v)===String(k)?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
    return `<input ${at} ${c.tipo==='numero'?'type="number" step="any"':''} value="${esc(v??'')}">`;
  };
  const desenhar=()=>{
    fundo.innerHTML=`<div class="modal"><h2>${titulo}</h2><p class="dica">${dica||'Edite, acrescente ou remova linhas. A ordem da lista é a ordem da tela.'}</p>
      <table><tr>${colunas.map(c=>`<th style="${c.largura?`width:${c.largura}`:''}">${c.rotulo}</th>`).join('')}<th style="width:92px"></th></tr>
      ${copia.map((l,i)=>`<tr>${colunas.map(c=>`<td>${campo(c,l[c.k],i)}</td>`).join('')}<td style="white-space:nowrap">
        <button class="icone-btn" title="Subir" data-sobe="${i}">${ic('arrow-up')}</button><button class="icone-btn" title="Remover" data-tira="${i}">${ic('trash-2')}</button></td></tr>`).join('')}</table>
      <div class="rodape"><button class="btn ghost" id="m-add">${ic('plus')}Acrescentar linha</button><div style="display:flex;gap:8px"><button class="btn ghost" id="m-cancela">Cancelar</button><button class="btn" id="m-ok">${ic('check')}Aplicar</button></div></div></div>`;
    fundo.className='modal-fundo on'; lucide.createIcons();
    fundo.querySelectorAll('[data-k]').forEach(el=>el.oninput=el.onchange=()=>{const c=colunas.find(x=>x.k===el.dataset.k);let v=el.value;if(c.tipo==='mes')v=+v;if(c.tipo==='numero')v=v===''?null:+v;copia[+el.dataset.i][el.dataset.k]=v;});
    fundo.querySelectorAll('[data-tira]').forEach(b=>b.onclick=()=>{copia.splice(+b.dataset.tira,1);desenhar();});
    fundo.querySelectorAll('[data-sobe]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sobe;if(i>0){[copia[i-1],copia[i]]=[copia[i],copia[i-1]];desenhar();}});
    $('#m-add').onclick=()=>{copia.push(nova());desenhar();};
    $('#m-cancela').onclick=fechar;
    $('#m-ok').onclick=()=>{aoSalvar(copia);fechar();mudou();render();};
  };
  const fechar=()=>{fundo.className='modal-fundo';fundo.innerHTML='';};
  desenhar();
}
// Lista de textos (bullets) usa o mesmo editor com uma coluna.
function editarLista(titulo,arr,dica){
  editarTabela({titulo,dica,colunas:[{k:'t',rotulo:'Item',tipo:'longo'}],linhas:arr.map(t=>({t})),nova:()=>({t:''}),
    aoSalvar:ls=>{arr.splice(0,arr.length,...ls.map(l=>String(l.t||'').trim()).filter(Boolean));}});
}
function editarTexto(titulo,obj,k){
  editarTabela({titulo,dica:'Texto corrido.',colunas:[{k:'t',rotulo:'Texto',tipo:'longo'}],linhas:[{t:obj[k]}],nova:()=>({t:''}),aoSalvar:ls=>{obj[k]=String(ls[0]?.t||'').trim();}});
}
const OP_FRENTES=()=>[['','Geral'],...FRENTES.map(f=>[f.id,f.nome])];

// ---------------------------------------------------------------- navegação
const SECOES = [
  {id:'geral',nome:'Visão geral',icone:'layout-dashboard',render:rGeral},
  {id:'apresentacao',nome:'Apresentação',icone:'presentation',render:rApresentacao},
  {id:'escopo',nome:'Escopo',icone:'file-text',render:rEscopo},
  {id:'jornada',nome:'Jornada',icone:'calendar-range',render:rJornada},
  {id:'frentes',nome:'Frentes',icone:'layers',render:rFrentes},
  {id:'plano',nome:'Plano de ação',icone:'list-checks',render:rPlano},
  {id:'indicadores',nome:'Indicadores',icone:'trending-up',render:rIndicadores},
  {id:'entregas',nome:'Entregas',icone:'folder-open',render:rEntregas},
  {id:'relatorio',nome:'Relatório mensal',icone:'clipboard-list',render:rRelatorio},
];

function montarApp(){
  document.title = `Reestruturação ${PROJETO.empresa.split(' ')[0]}`;
  $('#raiz').innerHTML=`<div class="app">
  <aside>
    <div class="brand"><span class="selo"><img src="/marcas/cecilio-rocha.svg" alt=""></span><div><b>C&amp;R</b><span>Reestruturação</span></div></div>
    <nav id="nav"></nav>
    ${PODE_EDITAR?`<div class="modo"><button id="b-editar">${ic('pencil-line')}Modo edição</button><div class="salvo" id="salvo"></div></div>`:''}
    <div class="foot">Consultoria <b>${esc(PROJETO.consultor)}</b><br>Out/2026 a Set/2027</div>
  </aside>
  <main><div class="faixa" id="faixa"></div><div id="main"></div></main></div>`;
  if(PODE_EDITAR){
    let ligado=false; try{ligado=localStorage.getItem('consultoria-editando')==='1';}catch{}
    document.body.classList.toggle('editando',ligado);
    const b=$('#b-editar'); b.classList.toggle('on',ligado);

function linhaGantt(label,ranges,sub=false){
  let h=`<div class="l${sub?' sub':''}">${label}</div>`;
  for(let m=0;m<12;m++){
    let bars='';
    ranges.forEach(r=>{ if(m===r.m[0]){const w=(r.m[1]-r.m[0]+1)*100;bars+=`<div class="b" style="left:3px;width:calc(${w}% - 6px);background:${r.cor};z-index:1" title="${r.t||''}"></div>`;} });
    h+=`<div class="c${m===MES_ATUAL?' now':''}">${bars}</div>`;
  }
  return h;
}
function faixasDaFrente(f){
  const r=[{m:f.janela.redesenho,cor:'var(--sky)',t:'Redesenho'},{m:[...f.janela.implantacao],cor:'var(--blue)',t:'Implantação'}];
  if(r[1].m[0]<=r[0].m[1]) r[1].m=[r[0].m[1]+1,r[1].m[1]];
  return r.filter(x=>x.m[0]<=x.m[1]);
}

const ORDEM_SETORES=SETORES;
// O conteúdo do relatório é MONTADO a partir das frentes. Fechar o mês grava esse conteúdo
// montado dentro do documento: daí em diante o relatório daquele mês não muda mais, mesmo com as
// frentes andando. Isso é o que dá o "antes e depois" de um mês para o outro.
function montarConteudo(m){
  const setores=ORDEM_SETORES.map(s=>{const fs=FRENTES.filter(f=>f.setor===s);const reg=t=>fs.flatMap(f=>f.registros.filter(r=>r.mes===m&&r.tipo===t).map(r=>r.texto));return {s,tem:fs.length>0,prob:reg('problema'),acoes:reg('acao'),res:reg('resultado'),prox:fs.flatMap(f=>f.proximos).slice(0,4)};}).filter(x=>x.tem);
  return {
    setores,
    implantados:FRENTES.flatMap(f=>f.implantados.filter(i=>i.mes===m).map(i=>({...i,frente:f.nome}))),
    indicadores:INDICADORES.map(k=>({...k})),
    plano:PLANO30.filter(p=>p.status!=='ok').map(p=>({...p})),
    pendencias:JSON.parse(JSON.stringify(DOC.pendencias)),
  };
}

  // 5. ORDEM DE ATAQUE
  const cores=['linear-gradient(160deg,var(--navy2),var(--blue2))','linear-gradient(160deg,var(--blue2),var(--blue))','linear-gradient(160deg,#3f8fb9,#6aaccb)'];
  const partes=ONDAS.map((o,i)=>`<div class="onda-c" style="background:${cores[i%3]}"><div class="q">${esc(o.nome)}</div><h3>${esc(o.titulo||o.nome)}</h3><div class="per">${mesesDe(o.meses)}</div><div class="itens${o.frentes.length>4?' duas':''}">${o.frentes.map(id=>FRENTES.find(f=>f.id===id)).filter(Boolean).map(f=>`<div class="it">${icS(f.icone)}${esc(f.nome)}</div>`).join('')}</div></div>`);
  S.push((n,t)=>`<div class="sl">${topoS('A ordem de ataque','Três ondas, uma base de cada vez')}<div class="conteudo"><div class="fluxo" style="grid-template-columns:${partes.map(()=>'1fr').join(' 60px ')}">${partes.join(`<div class="seta-f">${icS('chevron-right')}</div>`)}</div></div>${rodapeS(n,t)}</div>`);
  // 6. JORNADA
  S.push((n,t)=>{
    const linha=(label,ranges,sub)=>{let h=`<div class="l${sub?' sub':''}">${label}</div>`;for(let m=0;m<12;m++){let b='';ranges.forEach(r=>{if(m===r.m[0]){b+=`<div class="b" style="left:4px;width:calc(${(r.m[1]-r.m[0]+1)*100}% - 8px);background:${r.cor}"></div>`;}});h+=`<div class="c">${b}</div>`;}return h;};
    let g=`<div class="gantt-s"><div class="h"></div>${MESES.map(m=>`<div class="h">${m}</div>`).join('')}`;
    FASES.forEach(f=>g+=linha(`${f.n}. ${esc(f.nome)}`,[{m:f.meses,cor:'var(--navy2)'}]));
    ONDAS.forEach(o=>{g+=`<div class="sep">${esc(o.nome)}${o.titulo?` · ${esc(o.titulo)}`:''}</div>`;o.frentes.map(id=>FRENTES.find(f=>f.id===id)).filter(Boolean).forEach(f=>g+=linha(esc(f.nome),faixasDaFrente(f),true));});
    g+='</div>';
    return `<div class="sl">${topoS('A jornada','Doze meses de trabalho')}<div class="conteudo" style="top:190px;bottom:100px;font-size:15px">${g}<div class="legenda-s"><span><i style="background:var(--navy2)"></i>Fase</span><span><i style="background:var(--sky)"></i>Redesenho</span><span><i style="background:var(--blue)"></i>Implantação</span></div></div>${rodapeS(n,t)}</div>`;
  });
  // 7+. UMA SEÇÃO POR ONDA: divisor + as frentes em grupos de 3
  ONDAS.forEach((o,i)=>{
    const fs=o.frentes.map(id=>FRENTES.find(f=>f.id===id)).filter(Boolean);
    S.push(()=>`<div class="sl divisor"><div class="grande">${String(i+1).padStart(2,'0')}</div><div class="selo-p"><img src="${LOGO}" alt=""></div><div class="bloco"><div class="olho">${esc(o.nome)} · ${mesesDe(o.meses)}</div><h2>${esc(o.titulo||o.nome)}</h2><div class="per">${esc(o.descricao||'')}</div><div class="chips">${fs.map(f=>`<span>${icS(f.icone)}${esc(f.nome)}</span>`).join('')}</div></div></div>`);
    for(let k=0;k<fs.length;k+=3){
      const grupo=fs.slice(k,k+3);
      S.push((n,t)=>`<div class="sl">${topoS(`${esc(o.nome)} · o que vamos fazer`,grupo.map(f=>esc(f.nome)).join(', '))}<div class="conteudo"><div class="cards" style="grid-template-columns:repeat(${grupo.length},1fr)">${grupo.map(f=>`<div class="card-s"><div style="display:flex;align-items:center;gap:16px"><div class="ico">${icS(f.icone)}</div><h3>${esc(f.nome)}</h3></div><p style="font-size:18px;color:var(--blue2);font-weight:500">${esc(f.objetivo)}</p><ul>${f.escopo.slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="tagz">${f.entregas.slice(0,3).map(e=>`<span>${esc(e.nome)}</span>`).join('')}</div></div>`).join('')}</div></div>${rodapeS(n,t)}</div>`);
    }
  });
  // ENTREGAS
  const porTipo={}; FRENTES.forEach(f=>f.entregas.forEach(e=>{porTipo[e.tipo]=(porTipo[e.tipo]||0)+1;}));
  const icTipo={Processo:'workflow',Ferramenta:'wrench',Documento:'file-text',Desenho:'pen-tool',Planilha:'sheet',Ritual:'repeat',Treinamento:'graduation-cap'};
  const totalEnt=Object.values(porTipo).reduce((a,b)=>a+b,0);
  S.push((n,t)=>`<div class="sl">${topoS('A formalização','O que fica na empresa')}<div class="conteudo" style="display:grid;grid-template-columns:420px 1fr;gap:60px;align-items:center">
    <div><div class="num-big">${totalEnt}</div><div style="font-size:26px;color:var(--navy2);margin-top:10px;font-weight:600">entregas formais</div><p style="font-size:20px;color:#5b6772;line-height:1.5;margin-top:18px">Processos desenhados, ferramentas, documentos e rituais, cada um com responsável, guardados e prontos para a equipe usar depois da consultoria.</p></div>
    <div class="cards" style="grid-template-columns:repeat(3,1fr);height:auto">${Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).map(([tp,q])=>`<div class="card-s" style="padding:26px"><div class="ico">${icS(icTipo[tp]||'file')}</div><h3>${q} · ${esc(tp)}${q>1&&!tp.endsWith('s')?'s':''}</h3></div>`).join('')}</div>
  </div>${rodapeS(n,t)}</div>`);
  // INDICADORES
  S.push((n,t)=>`<div class="sl">${topoS('A medição','Indicadores de resultado')}<div class="conteudo"><table class="tabela"><tr><th>Indicador</th><th>Frente</th><th>Melhor quando</th><th>Meta</th></tr>${INDICADORES.slice(0,9).map(k=>`<tr><td><b>${esc(k.nome)}</b></td><td>${esc(FRENTES.find(f=>f.id===k.frente)?.nome||'Geral')}</td><td>${k.melhor==='menor'?'Menor':'Maior'}</td><td>${k.meta!=null&&k.meta!==''?esc(k.meta)+(k.unidade==='%'?'%':''):'<span style="color:#8a96a0">definida na Fase 2</span>'}</td></tr>`).join('')}</table><p style="font-size:17px;color:#8a96a0;margin-top:18px">A linha de base (o “antes”) é medida na Fase 2, antes de qualquer mudança.</p></div>${rodapeS(n,t)}</div>`);
  // GOVERNANÇA
  const icGov=['calendar-days','users','compass'];
  S.push((n,t)=>`<div class="sl">${topoS('A governança','Como o projeto é conduzido')}<div class="conteudo"><div class="cards" style="grid-template-columns:repeat(${GOVERNANCA.length},1fr)">${GOVERNANCA.map((g,i)=>`<div class="card-s"><div class="ico">${icS(icGov[i%3])}</div><h3>${esc(g.nome)}</h3><p><b style="color:var(--navy2)">Quem:</b> ${esc(g.quem)}</p><p><b style="color:var(--navy2)">Quando:</b> ${esc(g.quando)}</p><p><b style="color:var(--navy2)">Resultado:</b> ${esc(g.saida)}</p></div>`).join('')}</div></div>${rodapeS(n,t)}</div>`);
  // REGRAS DO JOGO
  S.push((n,t)=>`<div class="sl">${topoS('As regras do jogo','Critérios, premissas e limites')}<div class="conteudo"><div class="cards" style="grid-template-columns:1.2fr 1fr 1fr">
    <div class="card-s" style="background:linear-gradient(160deg,var(--navy2),var(--blue2));color:#fff;border:0"><div class="ico">${icS('shield-check')}</div><h3 style="color:#fff">Processo implantado é processo funcionando</h3><p style="color:#d6e6ef">Sugestão ou reunião não conta. Só entra como implantado o que está na rotina, com responsável e com evidência do antes e do depois.</p></div>
    <div class="card-s"><div class="ico">${icS('handshake')}</div><h3>Premissas</h3><ul>${(PROJETO.premissas||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="card-s"><div class="ico">${icS('circle-slash')}</div><h3>Fora do escopo</h3><ul>${(PROJETO.foraDoEscopo||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  </div></div>${rodapeS(n,t)}</div>`);
  // PRÓXIMOS 30 DIAS
  S.push((n,t)=>`<div class="sl">${topoS('Os primeiros passos','Próximos 30 dias')}<div class="conteudo"><table class="tabela"><tr><th>Ação</th><th>Responsável</th><th>Prazo</th></tr>${PLANO30.slice(0,8).map(p=>`<tr><td><b>${esc(p.acao)}</b><div style="font-size:15px;color:#8a96a0;margin-top:2px">${esc(p.esperado)}</div></td><td>${esc(p.resp)}</td><td>${esc(p.prazo)}</td></tr>`).join('')}</table></div>${rodapeS(n,t)}</div>`);
  // ENCERRAMENTO
  S.push(()=>`<div class="sl capa"><div class="linhas"></div><div class="marca-dagua"></div><div class="fecho"><div style="background:#fff;border-radius:22px;padding:18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35)"><img src="${LOGO}" style="width:170px;display:block" alt=""></div><div class="olho" style="color:var(--sky);margin-top:60px">Vamos começar</div><h1 style="font-family:Marcellus,serif;font-weight:400;font-size:84px;margin-top:14px">Obrigado</h1><div style="font-size:26px;color:#cfe0ea;margin-top:18px">${esc(nomeCurto())} · C2X</div></div></div>`);
  return S;
}

function htmlDosSlides(){const S=montarSlides();return S.map((f,i)=>f(i+1,S.length));}

function rApresentacao(){
  const sl=htmlDosSlides(); slideAtual=Math.min(slideAtual,sl.length-1);
  setTimeout(ajustarPalco,0);
  return topo('Apresentação','O plano do projeto em slides. Montado a partir dos dados do projeto: o que muda nas frentes aparece aqui',`<button class="btn ghost" onclick="imprimirDeck()">${ic('file-down')}PDF</button><button class="btn" onclick="telaCheia()">${ic('maximize')}Tela cheia</button>`)+`
  <div class="deck-bar"><div class="ctl"><button class="btn ghost" onclick="irSlide(-1)">${ic('chevron-left')}</button><span class="num" id="num-slide">${slideAtual+1} / ${sl.length}</span><button class="btn ghost" onclick="irSlide(1)">${ic('chevron-right')}</button></div><span class="muted" style="font-size:12.5px">Setas do teclado navegam · F para tela cheia</span></div>
  <div class="palco" id="palco">${sl[slideAtual]}<div class="seta esq" onclick="irSlide(-1)"></div><div class="seta dir" onclick="irSlide(1)"></div></div>
  <div class="miniaturas">${sl.map((h,i)=>`<button class="${i===slideAtual?'on':''}" onclick="slideAtual=${i};render()">${h}<i class="n">${i+1}</i></button>`).join('')}</div>`;
}
function ajustarPalco(){
  const p=document.getElementById('palco'); if(!p)return;
  const cheio=document.fullscreenElement===p;
  const w=cheio?innerWidth:p.clientWidth, h=cheio?innerHeight:p.clientHeight;
  const s=Math.min(w/1600,h/900);
  const el=p.querySelector('.sl'); if(el){el.style.transform=`scale(${s})`; if(cheio){el.style.margin=`0`;}}
  if(cheio&&el){p.style.width='100vw';p.style.height='100vh';el.style.position='absolute';el.style.left=`${(w-1600*s)/2}px`;el.style.top=`${(h-900*s)/2}px`;}
  else if(el){p.style.width='';p.style.height='';el.style.left='0';el.style.top='0';}
  document.querySelectorAll('.miniaturas button').forEach(b=>{const x=b.querySelector('.sl');if(x)x.style.transform=`scale(${b.clientWidth/1600})`;});
}
function irSlide(d){const total=htmlDosSlides().length;slideAtual=Math.max(0,Math.min(total-1,slideAtual+d));trocarSlide();}
function trocarSlide(){
  const p=document.getElementById('palco'); if(!p){render();return;}
  const sl=htmlDosSlides();
  const velho=p.querySelector('.sl'); const tmp=document.createElement('div'); tmp.innerHTML=sl[slideAtual]; velho.replaceWith(tmp.firstElementChild);
  const n=document.getElementById('num-slide'); if(n)n.textContent=`${slideAtual+1} / ${sl.length}`;
  document.querySelectorAll('.miniaturas button').forEach((b,i)=>b.classList.toggle('on',i===slideAtual));
  lucide.createIcons(); ajustarPalco();
}
function telaCheia(){const p=document.getElementById('palco');if(!p)return;(document.fullscreenElement?document.exitFullscreen():p.requestFullscreen()).catch(()=>{});}
function apresentar(){ir('apresentacao');slideAtual=0;render();setTimeout(telaCheia,50);}
function imprimirDeck(){
  let box=document.getElementById('impressao'); if(!box){box=document.createElement('div');box.id='impressao';document.body.appendChild(box);}
  box.innerHTML=htmlDosSlides().join(''); lucide.createIcons();
  let pg=document.getElementById('pagina-deck'); if(!pg){pg=document.createElement('style');pg.id='pagina-deck';document.head.appendChild(pg);}
  pg.textContent='@page{size:1600px 900px;margin:0}';
  document.body.classList.add('imprimindo-deck');
  setTimeout(()=>window.print(),300);
}
window.addEventListener('afterprint',()=>{document.body.classList.remove('imprimindo-deck');const pg=document.getElementById('pagina-deck');if(pg)pg.textContent='';});
window.addEventListener('resize',ajustarPalco);
document.addEventListener('fullscreenchange',ajustarPalco);
document.addEventListener('keydown',e=>{
  if(estado.secao!=='apresentacao'||document.querySelector('.modal-fundo.on'))return;
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();irSlide(1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();irSlide(-1);}
  if(e.key==='f'||e.key==='F')telaCheia();
});

carregar();
</script>
</body>
